      cur.d.stepSec=0;if(st.ans.filter(y=>y&&y.done).length===a.qs.length){st.done=true;st.first=st.ans.every(y=>y.ok)}save();render();
      const mk=document.getElementById('refmark');if(mk&&!x.ok)mk.scrollIntoView({behavior:'smooth',block:'center'});else focusAnswer();return}
    case'rd-next':if(st.qi<a.qs.length-1){st.qi++;save();render();window.scrollTo({top:document.querySelector('hr')?.offsetTop||0,behavior:'smooth'})}else advance();return;
    case'typed-check':checkTyped();return;
    case'ord-add':if(!st.done&&!st.picked.includes(i)){st.picked.push(i);saveSoon();render()}return;
    case'ord-rem':if(!st.done){st.picked.splice(j,1);saveSoon();render()}return;
    case'ord-check':{if(st.done||st.picked.length!==a.tiles.length)return;const qk=quick(a.key+'-0',a.t==='dialog'?5000:2500);
      const built=st.picked.map(k=>a.tiles[k]).join(' '),ok=[a.tiles.join(' '),...a.alts].some(x=>canon(x)===canon(built));
      if(qk&&!ok&&view!=='practice')st.quickWrong=true;
      st.msg=ok?'✓ Richtig zusammengesetzt!':a.t==='dialog'?'Nicht ganz – richtig ist: '+a.tiles.map((x,k)=>(k+1)+'. '+x).join('  ·  '):'Nicht ganz – richtig ist: „'+a.tiles.join(' ')+'.“';complete(a,ok);render();focusAnswer();return}
    case'm-left':if(st.pairs[i]!=null){delete st.pairs[i];st.active=null}else st.active=st.active===i?null:i;render();return;
    case'm-right':{const owner=Object.keys(st.pairs).find(k=>st.pairs[k]===j);
      if(st.active==null){if(owner!=null)delete st.pairs[owner]}
      else{if(owner!=null)delete st.pairs[owner];st.pairs[st.active]=j;st.active=null}
      saveSoon();render();return}
    case'm-check':{if(st.done||Object.keys(st.pairs).length!==a.pairs.length)return;const qk=quick(a.key+'-0',6000);
      const wrong=a.pairs.map((_,k)=>k).filter(k=>st.pairs[k]!==k);if(qk&&wrong.length&&view!=='practice')st.quickWrong=true;
      st.msg=wrong.length?`${a.pairs.length-wrong.length} von ${a.pairs.length} richtig. Schau dir die falschen Paare genau an – sie kommen später noch einmal.`:'✓ Alles richtig zugeordnet!';
      complete(a,!wrong.length,wrong.map(k=>a.ids[k]));render();focusAnswer();return}
    case'tl-add':if(st.tl&&!st.tl.picked.includes(i)){st.tl.picked.push(i);saveSoon();render()}return;
    case'tl-rem':if(st.tl){st.tl.picked.splice(j,1);saveSoon();render()}return;
    case'tl-check':checkTiles();return;
    case'tl-next':if(st.tl?.reveal)tilesNext(a);return;
    case'lt-add':if(!st.done&&!st.picked.includes(i)){st.picked.push(i);st.msg='';saveSoon();render()}return;
    case'lt-rem':if(!st.done){st.picked.splice(j,1);saveSoon();render()}return;
    case'lt-check':checkLetters();return;
    case'so-set':if(!st.done){st.as[i]=j;saveSoon();render()}return;
    case'so-check':checkSort();return;
    case'clz-check':checkCloze();return;
    case'say':sayIt(false);return;
    case'sayslow':sayIt(true);return;
    case'find-word':if(st.clicked!=null)return;st.clicked=i;st.clickOk=i===a.wrong;cur.d.stepSec=0;save();render();focusAnswer();return;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='name'||t.id==='klasse'){renderHWList();return}
  if(t.classList?.contains('dl')){const U=UNITS[+t.dataset.u],v=t.value;try{localStorage.setItem(TKEY_DL+U.id+':'+t.dataset.h,v)}catch(e){}const bis=v?v.replace(/[-T:]/g,''):'';const l=hwLink(U,t.dataset.h==='V'?'V':+t.dataset.h,bis);
    const box=t.closest('.linkbox');box.querySelector('.linkout').value=l;box.querySelector('[data-act=copylink]').dataset.link=l;return}
  if(t.classList?.contains('clz')&&cur&&(view==='task'||view==='practice')){const st=currentTask().st;if(!st.done){st.vals[+t.dataset.i]=t.value;saveSoon()}return}
  if(t.id!=='answer'||!cur||(view!=='task'&&view!=='vocab'&&view!=='practice'))return;
  const st=view==='vocab'?cur.v.cur.st:currentTask().st;if(st.done)return;
  st.val=t.value;
  if(st.showSol){st.showSol=false;$('#sol')?.remove();const m=$('#msg');st.msg='Jetzt schreib die Lösung selbst.';if(m)m.textContent=st.msg}
  saveSoon();
});
document.addEventListener('change',e=>{const t=e.target;if(t.classList?.contains('clz')&&cur&&(view==='task'||view==='practice')){const st=currentTask().st;if(!st.done){st.vals[+t.dataset.i]=t.value;saveSoon()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&e.target.tagName==='INPUT'){e.preventDefault();view==='vocab'?vCheckWrite():checkTyped()}});
['paste','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.target.id==='answer'||e.target.classList?.contains('clz')){e.preventDefault();const m=$('#msg');if(m){m.textContent='Einfügen ist hier nicht möglich – bitte selbst tippen.';m.className='fb bad'}}
}));
['copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target.closest?e.target:e.target.parentElement;if(el?.closest&&el.closest('.sol,.reading,.cloze,.q,.step'))e.preventDefault()}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);

function loadUnits(done){
  if(window.INLINE_UNITS||!CONFIG.units.length){done();return}
  let i=0;
  const next=()=>{
    if(i>=CONFIG.units.length){done();return}
    const src=CONFIG.units[i++],s=document.createElement('script');
    s.src=location.protocol==='file:'?src:src+'?v='+encodeURIComponent(CONFIG.version);
    s.onload=next;s.onerror=()=>{LOAD_ERRORS.push('Datei nicht gefunden: '+src);next()};
    document.head.appendChild(s);
  };
  next();
}
let FOCUS=null;
// Links sind signiert: Wer unit, hue oder bis in der Adresse ändert, macht den Link ungültig.
const linkSig=(id,h,bis)=>cyrb53([CONFIG.secret,'link',id,h,bis||''].join('|')).toString(36).slice(-6);
function hwLink(U,h,bis){return location.href.split('#')[0].split('?')[0]+'?unit='+encodeURIComponent(U.id)+'&hue='+h+(bis?'&bis='+bis:'')+'&s='+linkSig(U.id,h,bis)}
function parseBis(b){const m=/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(b||'');return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime():null}
$('#foot').textContent='Version '+CONFIG.version;
loadUnits(()=>{
  const qs=new URLSearchParams(location.search);
  if(qs.has('unit')||qs.has('hue')){
    const ui=UNITS.findIndex(U=>U.id===qs.get('unit')),hs=qs.get('hue'),h=hs==='V'?'V':+hs,bis=qs.get('bis')||'';
    const valid=ui>=0&&(h==='V'?!!UNITS[ui].vocab:h>=1&&h<=UNITS[ui].homeworks.length)&&qs.get('s')===linkSig(qs.get('unit'),h,bis)&&(!bis||parseBis(bis));
    FOCUS=valid?{ui,h,deadline:bis?parseBis(bis):null}:{bad:true};
  }
  if(new URLSearchParams(location.search).get('lehrer')==='1')view='teacher';
  render();
  setInterval(tick,1000);
});
