<!doctype html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Englisch-Lerntrainer</title>
<style>
:root{--ink:#29243a;--muted:#6f6577;--bg:#f8f5fa;--line:#e9dce8;--brand:#ac186d;--soft:#f8f1f8;--good:#1f9a5e;--goodbg:#e9f8ed;--bad:#d9822b;--badbg:#fff3e9;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:760px;margin:auto;padding:14px 14px 50px}
header{background:linear-gradient(115deg,#8c145f,#dd4a91);color:#fff;padding:14px 20px;border-radius:18px}
header h1{font-size:1.2rem;margin:6px 0 0}
.pill{background:#fff3fa;color:#9a185f;display:inline-block;padding:4px 11px;border-radius:20px;font-weight:700;font-size:.78rem;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #3020350b}
.card.compact{padding:12px 18px}
h2{font-size:1.25rem;margin:2px 0 12px}
h3{font-size:1.05rem;margin:18px 0 6px}
button{font:inherit;cursor:pointer;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;min-height:44px}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#efe6ef;color:#452e46}
button.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:.86rem;color:var(--muted)}
.q{font-weight:700;font-size:1.1rem;margin:4px 0}
.choices{display:grid;gap:9px;margin:14px 0}
.choice{text-align:left;background:var(--soft);color:var(--ink);border:1px solid #e9d8e7}
.choice.sel{outline:2px solid var(--brand);background:#fbe4f2}
.choice.right{background:var(--goodbg);border-color:var(--good);outline:0}
.choice.wrong{background:var(--badbg);border-color:var(--bad);outline:0}
.choice:disabled{opacity:1;cursor:default}
.fb{border-left:4px solid #6b74c9;background:#eef1ff;padding:11px 14px;border-radius:8px;margin:12px 0}
.fb.good{background:var(--goodbg);border-color:var(--good)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.sol{background:#fff8d6;border:2px dashed #d7a900;padding:12px 14px;border-radius:10px;font-size:1.2rem;font-weight:700;margin:10px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.input{width:100%;border:1px solid #c3b5c1;padding:12px;border-radius:10px;margin:8px 0;font:inherit;font-size:1.05rem;background:#fff;color:var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.input[readonly]{background:#f6f2f6}
select.input{padding:10px}
label{display:block;font-size:.9rem;font-weight:600}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.unit{margin-top:6px}
.unit h3{margin:4px 0 8px}
.hwrow{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.hwbtn{flex:1;text-align:left;background:var(--soft);color:var(--ink);border:1px solid #e9d8e7;padding:12px 14px}
.hwbtn b{display:block;font-size:1rem}
.hwbtn.done{background:var(--goodbg);border-color:#bfe6cc}
.progress{height:9px;background:#e9e0e8;border-radius:9px;overflow:hidden;margin:8px 0 6px}
.progress>div{height:100%;background:#a31d69;transition:width .3s}
.clock{font-size:.88rem;color:var(--muted)}
.clock.paused{color:#b4621b;font-weight:600}
.clock.reached{color:var(--good);font-weight:600}
.reading{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#fffaf0;border:1px solid #ead9b4;border-radius:12px;padding:14px 18px;line-height:1.75;white-space:pre-line}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.keys span{background:#fff;border:2px solid #cbb8c9;border-radius:10px;padding:6px 12px;font-weight:700;font-size:1.05rem}
.plan{background:#f3f8ee;border:1px solid #cfe3bd;border-radius:10px;padding:9px 13px;margin:10px 0;font-size:.95rem;line-height:1.6}
button.small{min-height:32px;padding:4px 10px;font-size:.85rem;margin-top:6px}
.gapw{white-space:nowrap;letter-spacing:.05em;font-family:ui-monospace,Menlo,Consolas,monospace}
.step{font-size:1.05rem}.merke{background:#fff8e1;border-left:4px solid #f0b400;border-radius:8px;padding:6px 14px;margin:10px 0}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d6d6d6;margin-left:3px}.sdot.done{background:#3a9d5d}.sdot.now{background:#2b6cb0}
.gl{border-bottom:2px dotted #a77bbf;cursor:pointer;border-radius:3px}.gl.on{background:#f3e7f0}
#glbox{position:absolute;z-index:50;display:none;max-width:260px;background:#3b1f4a;color:#fff;padding:7px 11px;border-radius:10px;font-size:.95rem;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.gloss{display:inline-block;background:#f3e7f0;border-radius:20px;padding:5px 11px;font-size:.86rem;margin:10px 0}
.tiles,.slot,.words{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tile{background:#efe2ed;color:#32283b}
.slot{border:2px dashed #cbb8c9;border-radius:10px;padding:10px;min-height:62px;align-items:center}
.slot .tile{background:#fbe4f2}
.preview{font-weight:700;margin:4px 0}
.word{background:var(--soft);color:var(--ink);border:1px solid #e9d8e7;padding:8px 12px}
.word.hit{background:var(--goodbg);border-color:var(--good)}
.word.bad{background:var(--badbg);border-color:var(--bad)}
.word.miss{text-decoration:line-through}
.word:disabled{opacity:1;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{text-align:left;background:var(--soft);color:var(--ink);border:1px solid #e9d8e7;padding:9px 12px}
.mitem.active{outline:3px solid var(--brand);background:#fbe4f2}
.mitem .n{display:inline-block;min-width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border-radius:50%;color:#fff;font-size:.8rem;font-weight:700;margin-right:6px;background:#bbb}
.c1{background:#ac186d!important}.c2{background:#2a6fb0!important}.c3{background:#1f9a5e!important}.c4{background:#c76a12!important}.c5{background:#6b4fbb!important}.c6{background:#0f8a8a!important}.c7{background:#7a5a2a!important}.c8{background:#3a3a3a!important}
.mitem.paired{border-color:#9b8a99}
.mres{list-style:none;padding:0;margin:10px 0}
.mres li{padding:6px 0;border-bottom:1px solid #f0e6ef}
.scene{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;margin:12px 0;container-type:inline-size}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:22%}
.scene .it{position:absolute;line-height:1;transform:translate(-50%,-50%);user-select:none;-webkit-user-select:none}
.nav{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
ul{padding-left:22px}
.rule{background:#f5eef7;border-radius:10px;padding:10px 14px}
/* Ergebniskarte */
.rcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #3020351a;margin:14px 0}
.rtop{background:linear-gradient(115deg,#8c145f,#dd4a91);color:#fff;padding:12px 18px}
.rtop.partial{background:linear-gradient(115deg,#9a5a12,#d99a2b)}
.rtop b{font-size:1.15rem;display:block}
.rtop span{font-size:.85rem;opacity:.95}
.rbody{padding:14px 18px 12px;text-align:center}
.rname{font-size:1.35rem;font-weight:800;line-height:1.25}
.rhw{color:var(--muted);font-size:.95rem;margin-top:2px}
.rbig{font-size:3.3rem;font-weight:800;line-height:1;margin:12px 0 0;color:#a31d69}
.rbig.partial{color:#b06a12}
.rbiglabel{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgrid div{background:var(--soft);border-radius:12px;padding:9px 4px}
.rgrid b{display:block;font-size:1.02rem}
.rgrid span{font-size:.74rem;color:var(--muted);line-height:1.2;display:block}
.rwords{margin:12px 0 0;font-size:.95rem}
.rtop.paused{background:repeating-linear-gradient(135deg,#5d5866,#5d5866 14px,#6c6775 14px,#6c6775 28px)}
.rbig.paused{color:#6c6775}
.rsub{font-size:.85rem;color:var(--muted);margin:-6px 0 10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cmpbox{border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.cmpbox b{font-size:2.2rem;line-height:1.1}
.cmpbox span{font-size:.85rem}
.cmpbox.orange{background:#fff3e9;color:#8a4a0c}
.cmpbox.pink{background:#fbe4f2;color:#8c145f}
.plist{list-style:none;padding:0;margin:10px 0}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid #f0e6ef}
.pstat{white-space:nowrap;font-size:.9rem}
.srcsent{background:#fffaf0;border:1px solid #ead9b4;border-radius:10px;padding:10px 14px;font-size:1.1rem;margin:8px 0}
.srcsent mark{background:#ffd9a8;border-radius:4px;padding:0 3px}
.frame{background:#eef1ff;border:2px dashed #8d95d6;border-radius:10px;padding:10px 14px;font-size:1.1rem;font-weight:600;letter-spacing:.02em;margin:10px 0;word-spacing:.15em}
.ltile{min-width:44px;font-weight:700;font-size:1.15rem;text-transform:none}
.vlist{flex-direction:column;align-items:stretch}
.tile.line{text-align:left}
.sortlist{display:grid;gap:8px;margin:12px 0}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid #e9d8e7;border-radius:10px;padding:8px 10px}
.sortbtns{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;color:var(--ink);border:1px solid #cbb8c9;min-height:36px;padding:6px 10px;font-size:.88rem}
.chip.sel{background:#fbe4f2;border-color:var(--brand);outline:2px solid var(--brand)}
.chip.right{background:var(--goodbg);border-color:var(--good)}
.chip.wrong{background:var(--badbg);border-color:var(--bad)}
.chip:disabled{opacity:1;cursor:default}
.cloze{background:#fffaf0;border:1px solid #ead9b4;border-radius:12px;padding:14px 16px;line-height:2.4;font-size:1.05rem;margin:10px 0}
.clz{font:inherit;font-size:1rem;border:1px solid #b9a7b7;border-radius:8px;padding:3px 6px;background:#fff;color:var(--ink);max-width:100%}
.clz.ok{background:var(--goodbg);border-color:var(--good)}
.clz.bad{background:var(--badbg);border-color:var(--bad)}
.fix{color:var(--good);font-weight:700}
.rflag{margin-top:10px;background:var(--badbg);border-radius:10px;padding:7px 10px;font-size:.85rem;color:#8a4a0c}
.rfoot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #f0e6ef;font-size:.85rem;color:var(--muted)}
.rfoot b{color:var(--ink);letter-spacing:.08em}
.steps{margin:6px 0 0;padding-left:20px}
.vcard{background:var(--soft);border-radius:14px;padding:18px;text-align:center;margin:10px 0}
.ven{font-size:1.7rem;font-weight:800}
.vde{font-size:1.15rem;margin:4px 0 8px}
.vex{font-style:italic;color:var(--muted);margin-bottom:10px}
.vbig{font-size:1.35rem}
.vimg{display:block;width:auto;height:auto;max-width:min(300px,85%);max-height:300px;border-radius:16px;margin:8px auto 10px;box-shadow:0 2px 10px #3020351f}
.timgs{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:6px 0 12px}
.timgs img{width:auto;height:auto;max-height:230px;max-width:46%;border-radius:14px;box-shadow:0 2px 10px #3020351f;background:#fff}
.timgs.one img{max-height:260px;max-width:75%}
.timgs.three img{max-height:170px;max-width:31%}
@media(max-width:560px){.timgs img{max-height:180px}.timgs.one img{max-height:220px}.timgs.three img{max-height:130px}}
.vthumb{width:56px;height:56px;object-fit:cover;border-radius:8px}
.vdist{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.linkbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fcfafc}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;border-bottom:1px solid #eee4ee;padding:7px 5px;vertical-align:top}
.ok{color:var(--good);font-weight:700}.err{color:#b4621b;font-weight:700}
footer{text-align:center;margin-top:20px}
@media(max-width:560px){.card{padding:15px}.two{grid-template-columns:1fr}.rbig{font-size:2.5rem;margin-top:6px}.rcard{margin-top:0}.rbody{padding:10px 12px 10px}.rname{font-size:1.15rem}.rtop{padding:10px 14px}.rtop b{font-size:1.02rem}.rbiglabel{margin-bottom:4px}.rsub{margin:-2px 0 8px}.rgrid b{font-size:.95rem}.rwords{font-size:.88rem;margin-top:8px}.rflag{font-size:.8rem;margin-top:8px}.rfoot{margin-top:8px;padding-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"><span class="pill" id="pill">Englisch</span><h1 id="htitle">Englisch-Lerntrainer</h1></header>
  <main id="app"><section class="card">Aufgaben werden geladen …</section></main>
  <footer class="note" id="foot"></footer>
</div>
<script>
'use strict';
/* =====================================================================
   EINSTELLUNGEN – hier darfst du etwas ändern
   ===================================================================== */
const CONFIG = {
  title: 'Englisch-Lerntrainer',
  // Unit-Dateien im Ordner "units". Neue Units einfach in diese Liste eintragen (neueste zuerst).
  units: [
    'units/more2_unit4_animals.js',
    'units/more2_unit3_halloween.js',
    'units/beispiel_neue_aufgabentypen.js'   // Beispiel aller Aufgabentypen – nur Vorschau auf der Lehrerseite
  ],
  minSeconds: 15 * 60,     // Mindest-Lernzeit pro Hausübung (nur aktive Zeit)
  maxSeconds: 20 * 60,     // ab hier fallen offene Wiederholungen weg – nur Pflichtaufgaben bleiben
  capSeconds: 25 * 60,     // Zeitdeckel: ab hier geht es direkt zur Lernkontrolle, restliche Übungen zählen als erledigt
  secret: 'lt-7f3k9q-2026',// für das Prüfzeichen auf der Ergebniskarte – beliebig ändern
  storeKey: 'englisch-lerntrainer-v7',
  idleLimit: 90,           // ohne Tippen/Scrollen pausiert die Uhr nach … Sekunden
  idleReading: 240,        // … beim Lesen eines Textes (Lesen ohne Berühren ist normal)
  idleWriting: 150,        // … bei Schreibaufgaben (Nachdenken)
  stepCap: 180,            // höchstens so viele Sekunden pro Aufgabe zählen als Lernzeit
  readingCap: 420,         // … beim Lesen eines Textes (erste Frage)
  writingCap: 360,         // … bei freien Schreibaufgaben
  quickMs: 2500,           // Auswahl schneller als 2,5 s → „Schnellklick“ (falsch + Schnellklick zählt nicht als erledigt)
  quickReadMs: 15000,      // erste Lesefrage nach weniger als 15 s → Text vermutlich nicht gelesen
  flagAt: 6,               // ab so vielen Schnellklicks/Unsinn-Eingaben erscheint ein Hinweis auf der Karte
  maxReviews: 10,          // höchstens so viele Wiederholungsaufgaben pro Hausübung (je Fehler höchstens 2)
  readSecPerWord: 0.25,    // Lesetext: „Gelesen“-Knopf frühestens nach so vielen Sekunden pro Wort (sehr schneller Leser)
  version: '9.9'
};
/* ===================================================================== */
const UNITS = [], LOAD_ERRORS = [];
function registerUnit(u){
  if(!u||!u.id){LOAD_ERRORS.push('Eine Unit-Datei hat keine id.');return}
  if(UNITS.some(x=>x.id===u.id)){LOAD_ERRORS.push('Unit doppelt eingetragen: '+u.id);return}
  UNITS.push(u);
}
window.addEventListener('error',e=>{if(e.filename&&/units\//.test(e.filename))LOAD_ERRORS.push(`Fehler in ${e.filename.split('/').pop().split('?')[0]} (Zeile ${e.lineno}): ${e.message}`)});
</script>

<script>
'use strict';
/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
const lowerFirst=s=>/^(You|We|The|They|She|He|It|I'm|My|Our|There)\b/.test(s)?s[0].toLowerCase()+s.slice(1):s;
const reCache={};
const RX=s=>reCache[s]||(reCache[s]=new RegExp(s,'i'));
const CONTRACTIONS=[[/\bdo not\b/g,"don't"],[/\bdoes not\b/g,"doesn't"],[/\bdid not\b/g,"didn't"],[/\bis not\b/g,"isn't"],[/\bare not\b/g,"aren't"],[/\bwas not\b/g,"wasn't"],[/\bwere not\b/g,"weren't"],[/\bcan ?not\b/g,"can't"],[/\bshould not\b/g,"shouldn't"],[/\bwould not\b/g,"wouldn't"],[/\bcould not\b/g,"couldn't"],[/\bwill not\b/g,"won't"],[/\bhave not\b/g,"haven't"],[/\bhas not\b/g,"hasn't"],[/\bmust not\b/g,"mustn't"]];
function canon(s,U,keepShort){
  let c=String(s??'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”„"«»]/g,'').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim().replace(/\s+,/g,',');
  if(!keepShort)CONTRACTIONS.forEach(([r,v])=>c=c.replace(r,v));
  ((U||cur?.unit)?.normalize||[]).forEach(([a,b])=>c=c.replace(new RegExp(a,'gi'),b));
  return c;
}
const splitSentences=v=>String(v).split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(prev[j]+1,row[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}
  return prev[b.length];
}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
// Mini-Formatierung für Texte aus Unit-Dateien: **fett**, *kursiv*, ~~durchgestrichen~~, Listen mit "- ", Absätze
function md(text){
  return String(text||'').split(/\n{2,}/).map(block=>{
    const lines=block.split('\n');
    const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\*(.+?)\*/g,'<i>$1</i>');
    if(lines.every(l=>/^- /.test(l)))return'<ul>'+lines.map(l=>'<li>'+inline(l.slice(2))+'</li>').join('')+'</ul>';
    return'<p>'+lines.map(inline).join('<br>')+'</p>';
  }).join('');
}
const normName=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
// Namen schön schreiben: „STEVEN berger“ → „Steven Berger“ (gemischte Schreibung wie „McDonald“ bleibt)
const niceName=s=>String(s||'').trim().replace(/[,;]+$/,'').replace(/([A-Za-zÄÖÜäöüß]{4,})\.+$/,'$1').trim().replace(/\s+/g,' ').split(' ').map(w=>w.split('-').map(p=>p===p.toLowerCase()||p===p.toUpperCase()?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():p).join('-')).join(' ');
function nameProblem(name){
  const parts=name.split(' ').filter(Boolean);
  if(name.length<3||parts.length<2)return'Bitte gib deinen Vor- und Nachnamen ein.';
  const last=parts[parts.length-1],letters=last.replace(/[^A-Za-zÄÖÜäöüß]/g,'');
  if(letters.length<2||(/\./.test(last)&&letters.length<=3))return'Bitte schreib deinen ganzen Nachnamen – nicht nur Anfangsbuchstaben.';
  const first=parts[0],fl=first.replace(/[^A-Za-zÄÖÜäöüß]/g,'');
  if(fl.length<2||(/\./.test(first)&&fl.length<=3))return'Bitte schreib deinen ganzen Vornamen – nicht nur Anfangsbuchstaben.';
  return null;
}

function validateUnit(U){
  const P=[],W=U.words||{},R=U.readings||{},SC=U.scenes||{};
  const re=(r,where)=>{try{new RegExp(r,'i')}catch(e){P.push(`${where}: ungültiger Ausdruck „${r}“`)}};
  if(!U.title)P.push('title fehlt');
  if(!Array.isArray(U.homeworks)||!U.homeworks.length)P.push('homeworks fehlt oder leer');
  (U.errors||[]).forEach((e,i)=>re(e.re,'errors '+(i+1)));
  (U.normalize||[]).forEach((n,i)=>re(n[0],'normalize '+(i+1)));
  Object.entries(R).forEach(([id,r])=>{
    if(!r.text||!Array.isArray(r.questions)||!r.questions.length)P.push(`Lesetext „${id}“: text oder questions fehlt`);
    (r.questions||[]).forEach((q,i)=>{if(q.tf==null&&(!q.right||!Array.isArray(q.wrong)||!q.wrong.length))P.push(`Lesetext „${id}“, Frage ${i+1}: right/wrong oder tf fehlt`);if(q.ref&&!String(r.text).includes(q.ref))P.push(`Lesetext „${id}“, Frage ${i+1}: ref „${q.ref}“ steht nicht genau so im Text`)});
    Object.keys(r.glosses||{}).forEach(k=>{if(!new RegExp(`(^|[^A-Za-z])${k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?![A-Za-z])`,'i').test(r.text||''))P.push(`Lesetext „${id}“: Wort-Hilfe „${k}“ kommt im Text nicht vor`);
      if(Object.values(W).some(x=>String(x.en).toLowerCase()===k.toLowerCase()))P.push(`Lesetext „${id}“: „${k}“ ist ein Unit-Wort – nicht übersetzen (Lernziel)`)});
    (r.gist||[]).forEach((q,i)=>{if(q.tf==null&&(!q.right||!Array.isArray(q.wrong)||!q.wrong.length))P.push(`Lesetext „${id}“, Gedächtnisfrage ${i+1}: right/wrong oder tf fehlt`)});
  });
  const tasks=[...(U.homeworks||[]).flatMap((h,hi)=>(h.tasks||[]).map((t,ti)=>[t,`HÜ ${hwNo(U,hi+1)}, Aufgabe ${ti+1}`])),...(U.extras||[]).map((t,i)=>[t,`Zusatz ${i+1}`])];
  for(const [t,where] of tasks){
    if(!DEFAULT_TOPIC[t.t]&&t.t!=='intro'){P.push(`${where}: unbekannter Typ „${t.t}“`);continue}
    (t.w||[]).forEach(w=>{if(!W[w])P.push(`${where}: Wort „${w}“ fehlt in words`)});
    if(t.imgs&&!Array.isArray(t.imgs))P.push(`${where}: imgs muss eine Liste sein`);
    (t.accept||[]).forEach(r=>re(r,where));
    (t.rules||[]).forEach(r=>{if(r.re)re(r.re,where);(r.res||[]).forEach(x=>re(x,where))});
    switch(t.t){
      case'intro':if(!t.title)P.push(`${where}: title fehlt`);
        (t.steps||[]).forEach((S,k)=>{if(!S.text)P.push(`${where}, Schritt ${k+1}: text fehlt`);[S.check,S.check2].forEach(C=>{if(C&&(!C.q||!C.right||!Array.isArray(C.wrong)||!C.wrong.length))P.push(`${where}, Schritt ${k+1}: Frage braucht q, right und wrong`)})});break;
      case'mc':if(!t.q||!t.right||!Array.isArray(t.wrong)||!t.wrong.length)P.push(`${where}: q/right/wrong fehlt`);else if(t.wrong.includes(t.right))P.push(`${where}: richtige Antwort steht auch bei wrong`);break;
      case'gap':if(!t.q||!t.ans?.length)P.push(`${where}: q/ans fehlt`);
        {const m=/\(([^)]+)\)\s*$/.exec(t.q||''),inner=(m?.[1]||'').toLowerCase(),isDe=m&&(/[äöüß]/.test(inner)||Object.values(W).some(x=>String(x.de).toLowerCase().split(/[,;(]/).map(y=>y.trim()).includes(inner)));
        if(isDe&&t.rule)P.push(`${where}: deutsches Wort „${m[1]}“ in Klammern – Abkürzung. Besser: first: true (Anfangsbuchstabe).`)}
        if(t.w?.length&&!t.rule&&/\([^)]*[a-zäöüß][^)]*\)\s*$/i.test(t.q||''))P.push(`${where}: deutsches Wort in Klammern am Satzende – Abkürzung (man liest den Satz nicht). Besser: first: true (Anfangsbuchstabe).`);break;
      case'sent':case'pic':case'open':
        if(t.model&&t.distract&&!Array.isArray(t.distract))P.push(`${where}: distract muss eine Liste sein`);
        if(!t.q)P.push(`${where}: q fehlt`);
        if(!(t.ans?.length||t.accept?.length||t.rules?.length))P.push(`${where}: ans, accept oder rules nötig`);
        if(t.t!=='sent'&&!t.model)P.push(`${where}: model fehlt`);
        if(t.easy&&(!t.easy.q||!t.easy.model||!t.easy.rules?.length))P.push(`${where}: easy braucht q, model und rules`);
        if(t.plan){const pl=t.plan;if(!pl.example)P.push(`${where}: plan.example fehlt`);else if(canon(pl.example)===canon(t.model||''))P.push(`${where}: plan.example darf nicht die Musterlösung sein`);
          if(!Array.isArray(pl.slots)||!pl.slots.length||pl.slots.some(sl=>!sl.name||!Array.isArray(sl.from)||sl.from.length<2))P.push(`${where}: plan.slots braucht name und from (mind. 2 Wörter)`);
          else (pl.frame||'').replace(/\{(?:a|A)?(\d)\}/g,(m,k)=>{if(!pl.slots[+k])P.push(`${where}: plan.frame verweist auf {${k}}, das es nicht gibt`);return m})}
        if(t.t==='pic'&&!SC[t.scene])P.push(`${where}: Bild „${t.scene}“ fehlt in scenes`);break;
      case'order':if(!Array.isArray(t.tiles)||t.tiles.length<2)P.push(`${where}: tiles fehlt`);break;
      case'match':if(!Array.isArray(t.words)||t.words.length<3)P.push(`${where}: words (mind. 3) fehlt`);else t.words.forEach(w=>{if(!W[w])P.push(`${where}: Wort „${w}“ fehlt in words`)});break;
      case'find':if((String(t.sentence).match(/\*[^*]+\*/g)||[]).length!==1)P.push(`${where}: sentence braucht genau ein *falsches* Wort`);if(!t.fix?.length)P.push(`${where}: fix fehlt`);break;
      case'reading':if(!R[t.reading])P.push(`${where}: Lesetext „${t.reading}“ fehlt`);break;
      case'odd':if(!Array.isArray(t.items)||t.items.length<3||!t.items.includes(t.odd))P.push(`${where}: items (mind. 3) und odd (eines der items) nötig`);break;
      case'letters':if(!t.word||!t.de)P.push(`${where}: word und de nötig`);break;
      case'sort':if(!Array.isArray(t.groups)||t.groups.length<2||!Array.isArray(t.items)||t.items.length<3||t.items.some(x=>!Array.isArray(x)||x[1]==null||x[1]>=t.groups.length))P.push(`${where}: groups (mind. 2) und items [Text, Gruppennummer] (mind. 3) nötig`);break;
      case'cloze':if(!/\[.+?\]/.test(t.text||''))P.push(`${where}: text braucht Lücken wie [richtig|falsch|falsch] oder [[Antwort]]`);break;
      case'dialog':if(!Array.isArray(t.lines)||t.lines.length<3)P.push(`${where}: lines (mind. 3) nötig`);break;
      case'listen':if(!t.say)P.push(`${where}: say fehlt`);break;
      case'transform':if(!t.q||!t.from||!(t.ans?.length||t.accept?.length||t.rules?.length))P.push(`${where}: q, from und ans/accept/rules nötig`);break;
      case'correct':if(!t.sentence||!(t.ans?.length||t.accept?.length))P.push(`${where}: sentence und ans/accept nötig`);break;
    }
  }
  const rulesUsed=new Set(tasks.map(([t])=>t.rule).filter(Boolean));
  rulesUsed.forEach(r=>{if(!tasks.some(([t])=>t.rule===r&&PTYPES.includes(t.t)))P.push(`Regel „${r}“: keine Aufgabe vom Typ mc, gap, find, order oder sent – so kann sie nicht nachgeübt werden`)});
  (U.homeworks||[]).forEach((h,hi)=>(h.control?.sentences||[]).forEach((s,i)=>{if(!s.de||!s.ans?.length)P.push(`HÜ ${hwNo(U,hi+1)}, Lernkontrolle Satz ${i+1}: de/ans fehlt`)}));
  return P;
}
function selfTest(U){
  const P=[];let n=0;
  const tasks=[...U.homeworks.flatMap((h,hi)=>h.tasks.map((t,ti)=>[t,`HÜ ${hwNo(U,hi+1)}, Aufgabe ${ti+1}`])),...(U.extras||[]).map((t,i)=>[t,`Zusatz ${i+1}`])];
  for(const [t0,where] of tasks){
    if(!['gap','sent','pic','open','find','listen','transform','correct'].includes(t0.t))continue;
    const t=prep(clone(t0),U);n++;
    const good=t.t==='find'?t.fix[0]:t.t==='gap'?t.ans[0]:(t.model||t.ans?.[0]);
    try{
      if(!evaluate(t,good,U).ok)P.push(`${where}: Musterlösung „${good}“ wird nicht akzeptiert`);
      if(evaluate(t,'xyz',U).ok)P.push(`${where}: Unsinn („xyz“) wird akzeptiert – Regel zu locker`);
      if(t0.easy){const e=prep({...clone(t0),q:t0.easy.q,rules:t0.easy.rules,model:t0.easy.model},U);
        if(!evaluate(e,e.model,U).ok)P.push(`${where}: leichte Form – Musterlösung „${e.model}“ wird nicht akzeptiert`)}
    }catch(e){P.push(`${where}: Prüffehler ${e.message}`)}
  }
  return{n,P};
}

function prep(a,U){
  a.st=a.st||{};a.topic=a.topic||DEFAULT_TOPIC[a.t]||'general';a.w=a.w||[];
  if(a.t==='mc'){if(a.right!=null){a.opts=[a.right,...a.wrong];a.ans=0;delete a.right;delete a.wrong}const idx=shuffle(a.opts.map((_,i)=>i));a.opts=idx.map(i=>a.opts[i]);a.ans=idx.indexOf(a.ans)}
  if(a.t==='order'){let p;do{p=shuffle(a.tiles.map((_,i)=>i))}while(a.tiles.length>1&&p.every((v,i)=>v===i));a.shuf=p;a.alts=a.alts||[]}
  if(a.t==='match'){a.ids=a.words;a.pairs=a.ids.map(id=>[U.words[id].en,U.words[id].de]);a.w=a.ids;a.lord=shuffle(a.pairs.map((_,i)=>i));a.rord=shuffle(a.pairs.map((_,i)=>i))}
  if(a.t==='reading'){const R=U.readings[a.reading];
    const mk=(q,gist)=>{if(q.tf!=null)return{q:q.q,tf:!!q.tf,tip:q.tip||'',ref:q.ref||'',gist};const o=[q.right,...q.wrong];const idx=shuffle(o.map((_,i)=>i));return{q:q.q,o:idx.map(i=>o[i]),ans:idx.indexOf(0),tip:q.tip||'',ref:q.ref||'',gist}};
    a.qs=[...(R.gist||[]).map(q=>mk(q,true)),...R.questions.map(q=>mk(q,false))];a.gistN=(R.gist||[]).length;
    a.minRead=Math.round(wordCount(R.text)*CONFIG.readSecPerWord);}
  if(a.t==='find'){const toks=a.sentence.split(' ');a.wrong=toks.findIndex(x=>x.includes('*'));a.tokens=toks.map(x=>x.replace(/\*/g,''));a.wrongWord=a.tokens[a.wrong].replace(/[.,!?]/g,'')}
  // „(fast or slow?)“: Reihenfolge der zwei Angaben zufällig – die richtige steht nicht immer vorne
  if(a.t==='gap'&&!a.orDone){a.orDone=true;if(Math.random()<.5)a.q=a.q.replace(/\(([^()]+?) or ([^()]+?)\?\)\s*$/,'($2 or $1?)')}
  if(a.t==='sent'&&!a.model)a.model=(a.ans||[])[0];
  if(a.t==='open'||a.multi)a.multi=true;
  // ---- neue Typen ----
  if(a.t==='odd'){a.opts=shuffle(a.items);a.ans=a.opts.indexOf(a.odd)}
  if(a.t==='letters'){const ch=[...a.word];let p;do{p=shuffle(ch.map((_,i)=>i))}while(ch.length>1&&p.every((v,i)=>ch[v]===ch[i]));a.chars=ch;a.shuf=p}
  if(a.t==='sort'){a.ord=shuffle(a.items.map((_,i)=>i))}
  if(a.t==='dialog'){a.tiles=a.lines;let p;do{p=shuffle(a.tiles.map((_,i)=>i))}while(a.tiles.length>1&&p.every((v,i)=>v===i));a.shuf=p;a.alts=[]}
  if(a.t==='cloze'){
    a.parts=[];let last=0;const re=/\[\[(.+?)\]\]|\[(.+?)\]/g;let m;
    while((m=re.exec(a.text))){a.parts.push({text:a.text.slice(last,m.index)});
      if(m[1]!=null)a.parts.push({gap:{kind:'typed',ans:m[1].split('|').map(x=>x.trim())}});
      else{const o=m[2].split('|').map(x=>x.trim());const opts=shuffle(o);a.parts.push({gap:{kind:'choice',opts,ans:opts.indexOf(o[0]),right:o[0]}})}
      last=re.lastIndex}
    a.parts.push({text:a.text.slice(last)});a.gaps=a.parts.filter(x=>x.gap).map(x=>x.gap);
  }
  if(a.t==='listen'){a.ans=a.ans||[a.say];a.model=a.model||a.say}
  if((a.t==='transform'||a.t==='correct')&&!a.model)a.model=(a.ans||[])[0];
  return a;
}
function addTask(d,a,pos){

}

let simSkip=new Set(),simLast=null;
function nameSimilar(a,b){
  const A=normName(a).split(' '),B=normName(b).split(' ');if(normName(a)===normName(b))return true;
  if([...A].sort().join(' ')===[...B].sort().join(' '))return true;
  if(lev(A.join(' '),B.join(' '))<=2)return true;
  const close=(x,y)=>x===y||(x.length>=3&&y.length>=3&&(x.startsWith(y)||y.startsWith(x)))||(Math.min(x.length,y.length)>=4&&lev(x,y)<=1);
  const fa=A[0],la=A[A.length-1],fb=B[0],lb=B[B.length-1];
  return(fa===fb&&close(la,lb))||(la===lb&&close(fa,fb))||(fa===lb&&close(la,fb))||(la===fb&&close(fa,lb));
}

}

function wordsWithError(a){
  const st=a.st;if(st.firstWrong==null||!a.w?.length)return null;
  const c=canon(st.firstWrong);return a.w.filter(w=>{const W=cur.unit.words[w];return!W||!new RegExp('\\b'+canon(W.en).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(c)});
}
// Texte (Sortier-Karten, Lücken-Lösungen) den Wörtern der Unit zuordnen
function wordsInTexts(texts){
  const U=cur.unit,out=[];texts.forEach(t=>{const c=canon(t);Object.keys(U.words).forEach(w=>{const e=canon(U.words[w].en);if((c===e||c.startsWith(e))&&!out.includes(w))out.push(w)})});return out;
}
function complete(a,first,errWords){
  if(view==='practice')return pAfter(a,first);
  if(!first&&!errWords)errWords=wordsWithError(a)||undefined;
  const st=a.st;st.done=true;st.first=first;cur.d.stepSec=0;
  if(!first&&!a.control){st.errWords=errWords||a.w||[];if(!a.stair)scheduleReview(a,st.errWords)}   // Stufen der Schreibtreppe lösen keine Wiederholung aus – die Treppe selbst ist die Übung
  else if(!first&&a.control)st.errWords=a.w||[];
  else if(first&&a.review&&a.stage===1)scheduleReview(a,[]);
  save();
}

/* ---------- Wortschatz-Generator ---------- */
function introduced(U,h){const s=new Set();U.homeworks.slice(0,h).forEach(hw=>hw.tasks.forEach(t=>(t.w||t.words||[]).forEach(w=>s.add(w))));return[...s].filter(w=>U.words[w]&&!U.words[w].skipGen)}
function hwWords(U,h){const s=new Set();U.homeworks[h-1].tasks.forEach(t=>(t.w||t.words||[]).forEach(w=>s.add(w)));return[...s].filter(w=>U.words[w]&&!U.words[w].skipGen)}
function genGap(w){const W=cur.unit.words[w];if(!W||W.skipGen)return null;const img=imgOfWord(w);return{t:'gap',q:`Wie heißt das auf Englisch? → ${W.de}`,...(img?{img}:{}),ans:[W.en,...(W.alt||[])],w:[w],key:'g-gap-'+w}}
function genMC(w){
  const U=cur.unit,W=U.words[w];if(!W||W.skipGen)return null;
  let pool=introduced(U,cur.h).filter(x=>x!==w&&U.words[x].de!==W.de);
  if(pool.length<3)pool=Object.keys(U.words).filter(x=>x!==w&&!U.words[x].skipGen&&U.words[x].de!==W.de);
  return{t:'mc',q:`Was bedeutet „${W.en}“?`,right:W.de,wrong:shuffle(pool).slice(0,3).map(x=>U.words[x].de),why:`${W.en} = ${W.de}`,w:[w],key:'g-mc-'+w};
}
function genMatch(d){d.matchN=(d.matchN||0)+1;const ids=[...new Set([...weakIds(d),...shuffle(introduced(cur.unit,cur.h))])].slice(0,5);return{t:'match',words:ids,key:'g-match-'+d.matchN}}
function weakIds(d){const out=[];d.queue.forEach(a=>{if(a.st.done&&!a.st.first&&!a.control)(a.st.errWords||[]).forEach(w=>{if(cur.unit.words[w]&&!out.includes(w))out.push(w)})});return out}
function extrasFor(){return(cur.unit.extras||[]).map((x,i)=>({x,i})).filter(({x})=>(x.minHw||1)<=cur.h&&usable(x))}

/* ---------- Fehler aufarbeiten: zuerst VERSTEHEN (im Satz erkennen/auswählen), dann ANWENDEN (selbst in einen Satz schreiben) ----------
   Je Fehler höchstens 2 Wiederholungen, insgesamt höchstens CONFIG.maxReviews. Wörter kommen in einem neuen Satz wieder –
   aus den Zusatzaufgaben, aus früheren HÜs oder aus den Beispielsätzen des Vokabeltrainings. */
const CTX_CHOICE=['mc','cloze','odd'],CTX_WRITE=['gap','sent'];
function vocabFor(w){const W=cur.unit.words[w];if(!W)return null;const c=canon(W.en);return(cur.unit.vocab?.items||[]).find(x=>!x.forms&&canon(x.en)===c&&x.ex)||null}
function ctxCandidates(w,kind,used){
  const U=cur.unit,out=[],W=U.words[w];if(!W)return out;
  const ok=x=>(x.w||[]).includes(w)&&(kind==='choice'?CTX_CHOICE.includes(x.t):CTX_WRITE.includes(x.t)&&(x.t!=='sent'||x.ans?.length))&&usable(x)&&!x.control;
  extrasFor().forEach(({x,i})=>{if(ok(x)&&!used.has('x'+i))out.push({...clone(x),key:'x'+i})});
  U.homeworks.slice(0,Math.max(0,cur.h-1)).forEach((hw,hi)=>hw.tasks.forEach((x,ti)=>{const k=`hx${hi+1}-${ti}`;if(ok(x)&&!used.has(k))out.push({...clone(x),key:k})}));
  // Beispielsatz direkt beim Wort (words: {…, ex: 'Satz mit ___', exAns: 'Form in der Lücke', cat: 'animal'|'adj'})
  if(W.ex&&!W.skipGen)[].concat(W.ex).forEach((ex,k)=>{const tgt=(Array.isArray(W.exAns)?W.exAns[k]:W.exAns)||W.en,sfx=k?'-'+k:'';
    if(kind==='choice'&&!used.has('we-'+w+sfx)){
      // Ablenker nur aus derselben Wortgruppe (cat) – sonst erkennt man die Lösung schon an der Wortart. Ohne cat keine Auswahlaufgabe.
      const free=x=>x!==w&&!U.words[x].skipGen&&U.words[x].cat===W.cat&&U.words[x].en!==W.en&&!(W.avoid||[]).includes(x)&&!(U.words[x].avoid||[]).includes(w);   // avoid: Wörter, die im Satz auch passen würden
      const plural=tgt.toLowerCase()!==W.en.toLowerCase()&&/s$/.test(tgt),cap=/^[A-Z]/.test(tgt)&&!/^[A-Z]/.test(W.en);
      const pl=e=>/(s|x|ch|sh|o)$/.test(e)?e+'es':/[^aeiou]y$/.test(e)?e.slice(0,-1)+'ies':e+'s';
      const fits=x=>free(x)&&!(plural&&U.words[x].noPl);
      let pool=W.cat?introduced(U,cur.h).filter(fits):[];
      if(W.cat&&pool.length<3)pool=Object.keys(U.words).filter(fits);
      const form=x=>{let f=plural?(U.words[x].pl||pl(U.words[x].en)):U.words[x].en;return cap?f[0].toUpperCase()+f.slice(1):f};
      if(pool.length>=3)out.push({t:'mc',q:ex,right:tgt,wrong:shuffle(pool).slice(0,3).map(form),why:`${W.en} = ${W.de}`,w:[w],key:'we-'+w+sfx,topic:'vocabulary'});}
    if(kind==='write'&&!used.has('wx-'+w+sfx))out.push({t:'gap',q:ex,first:true,hintImg:imgOfWord(w),ans:[tgt,...(W.alt||[])],w:[w],key:'wx-'+w+sfx,topic:'vocabulary'});});
  const v=vocabFor(w);
  if(v){const tgt=v.target||v.en;
    if(kind==='choice'&&(v.wrong||[]).length>=3&&!used.has('vc-'+w))out.push({t:'mc',q:v.ex,right:tgt,wrong:v.wrong.slice(0,3),why:`${W.en} = ${W.de}`,w:[w],key:'vc-'+w,topic:'vocabulary'});
    if(kind==='write'&&!used.has('vw-'+w))out.push({t:'gap',q:v.ex,first:true,hintImg:v.img||imgOfWord(w),ans:[tgt,...(v.alt||[])],w:[w],key:'vw-'+w,topic:'vocabulary'});}
  return out;
}
// Satz ohne die deutsche Hilfe in Klammern – um denselben Satz nicht zweimal hintereinander zu zeigen
const baseQ=q=>canon(String(q||'').replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/,''));
function seenSentences(w){const S=new Set();(cur.d?.queue||[]).forEach(x=>{if((x.w||[]).includes(w)&&x.q)S.add(baseQ(x.q))});const pc=cur.d?.practice?.cur;if(pc?.q)S.add(baseQ(pc.q));return S}
function genCtx(w,kind,used){
  const c=ctxCandidates(w,kind,used||new Set());if(!c.length)return null;
  const seen=seenSentences(w),fresh=c.filter(x=>!seen.has(baseQ(x.q)));   // möglichst ein Satz, den das Kind noch nicht gesehen hat
  if(fresh.length)return shuffle(fresh)[0];
  // alle schon gesehen → wenigstens nicht derselbe Satz wie direkt davor
  const lastQ=view==='practice'?cur.d?.practice?.cur?.q:[...(cur.d?.queue||[])].slice(0,cur.d?.index+1||0).reverse().find(x=>(x.w||[]).includes(w))?.q;
  const notLast=c.filter(x=>baseQ(x.q)!==baseQ(lastQ));
  return shuffle(notLast.length?notLast:c)[0];
}
const deHint=de=>String(de).replace(/\s*\([^)]*\)/g,'').trim();
/* Keine Abkürzungen: In Satz-Aufgaben steht KEIN deutsches Wort in Klammern (sonst übersetzt man nur das Wort und liest den Satz nicht).
   Stattdessen: Anfangsbuchstabe + Anzahl der Buchstaben – das Wort ergibt sich erst aus dem Satz. */
// Bild zu einem Wort: words.img · sonst Bild aus dem Vokabeltrainer · sonst Muster wordImg ('…/u4-{id}.jpg'); noImg: true = kein Bild
function imgOfWord(w,U=cur.unit){const W=U.words[w];if(!W||W.noImg)return null;if(W.img)return W.img;
  const c=canon(W.en||''),v=(U.vocab?.items||[]).find(x=>!x.forms&&canon(x.en||'')===c);
  return v?.img||(U.wordImg?U.wordImg.replace('{id}',w):null)}
function gapQ(a){
  const q=esc(a.q);if(!a.first||!a.ans?.length||!q.includes('___'))return q;
  const w=String(a.ans[0]);
  const blanks=[...w].map((ch,i)=>i===0?`<b>${esc(ch)}</b>`:ch===' '?'&nbsp;&nbsp;':/[a-zäöüß]/i.test(ch)?'_':esc(ch)).join(' ');
  return q.replace('___',`<span class="gapw">${blanks}</span>`);
}
function ruleTask(rule,kind,used){
  const L=extrasFor().filter(({x,i})=>x.rule===rule&&!used.has('x'+i)&&!(x.model&&used.has('s:'+canon(x.model)))&&!(x.ans&&x.t==='sent'&&used.has('s:'+canon(x.ans[0]))));
  const pick=L.filter(({x})=>kind==='choice'?(isChoiceTask(x)||x.t==='order'):!(isChoiceTask(x)||x.t==='order'));
  const o=shuffle(pick.length?pick:L)[0];return o?{...clone(o.x),key:'x'+o.i}:null;
}
function makeReview(target,stage,used){
  if(target.w){const w=target.w;
    // lieber ein schon bekannter Satz noch einmal als eine nackte Wortfrage ohne Zusammenhang
    const again=k=>{const t=genCtx(w,k,new Set());if(t)t.key+='~'+(cur.d.reviews||0);return t};
    return stage===1?(genCtx(w,'choice',used)||genCtx(w,'write',used)||again('choice')||again('write')||genMC(w)):(genCtx(w,'write',used)||again('write')||genGap(w));}
  if(target.rule)return ruleTask(target.rule,stage===1?'choice':'write',used)||ruleTask(target.rule,stage===1?'write':'choice',used);
  return null;
}
function queueReview(t,target,stage,offset){
  const d=cur.d;if(!t||d.reviews>=CONFIG.maxReviews)return;
  t.review=true;t.stage=stage;t.reviewFor=target;if(d.phase==='extra')t.extra=true;d.reviews++;
  // Wiederholungen nie mitten in die Schreibtreppe schieben: davor – oder, wenn das Kind schon auf der Treppe ist, nach der freien Aufgabe
  let pos=Math.min(d.index+offset,d.queue.length);
  const inStair=q=>q>0&&q<d.queue.length&&d.queue[q-1].stair;
  if(inStair(pos)){let q=pos;while(q>d.index+1&&inStair(q))q--;
    if(inStair(q)){q=pos;while(q<d.queue.length&&(d.queue[q].stair||d.queue[q-1].stair))q++}
    pos=q}
  addTask(d,t,pos);
}
function scheduleReview(a,words){
  const d=cur.d;if(a.control||d.seconds>=CONFIG.maxSeconds)return;
  const used=new Set(d.usedKeys);
  if(a.review){   // eine Wiederholung wurde gerade bearbeitet
    if(a.stage===1&&a.reviewFor){const t=makeReview(a.reviewFor,2,used);queueReview(t,a.reviewFor,2,5)}
    return;
  }
  const targets=[];
  if((a.topic==='vocabulary'||(!a.rule&&words.length))&&words.length)words.slice(0,2).forEach(w=>targets.push({w}));
  else if(a.rule)targets.push({rule:a.rule});
  else if(a.topic==='grammar'||a.topic==='writing'){   // ohne Regelname: eine andere Grammatikaufgabe
    const pool=extrasFor().filter(({x,i})=>(x.topic||DEFAULT_TOPIC[x.t])==='grammar'&&!used.has('x'+i));
    const o=shuffle(pool.filter(({x})=>x.t!==a.t).length?pool.filter(({x})=>x.t!==a.t):pool)[0];
    if(o)queueReview({...clone(o.x),key:'x'+o.i},{},2,4);
    return;
  }
  targets.forEach((tg,n)=>{const t=makeReview(tg,1,used);if(t){used.add(t.key);queueReview(t,tg,1,3+n*2)}});
}
function nextExtra(d){
  const used=new Set(d.usedKeys);
  for(const w of weakIds(d)){const t=genCtx(w,'write',used)||genCtx(w,'choice',used);if(t&&!used.has(t.key))return t;if(!ctxCandidates(w,'write',new Set()).length)for(const f of [genGap,genMC]){const g=f(w);if(g&&!used.has(g.key))return g}}
  if(d.extraN>0&&d.extraN%5===0)return genMatch(d);
  const cands=[];
  extrasFor().forEach(({x,i})=>{const m=x.t==='sent'?(x.model||x.ans?.[0]):null;if(!used.has('x'+i)&&!(m&&used.has('s:'+canon(m))))cands.push({...clone(x),key:'x'+i})});
  // Wörter immer im Satz (Beispielsätze, frühere Aufgaben) – nackte Wortfragen nur, wenn es zu einem Wort gar keinen Satz gibt
  introduced(cur.unit,cur.h).forEach(w=>{let n=0;for(const k of ['choice','write']){const t=genCtx(w,k,used);if(t&&!used.has(t.key)&&!cands.some(c=>c.key===t.key)){cands.push(t);n++}}
    if(!n&&!ctxCandidates(w,'choice',new Set()).length&&!ctxCandidates(w,'write',new Set()).length)for(const f of [genGap,genMC]){const t=f(w);if(t&&!used.has(t.key))cands.push(t)}});
  if(!cands.length)return genMatch(d);
  const recent=d.queue.slice(-3).map(x=>x.t);
  // Schwierigkeit passend zum Kind: viele Treffer → eher schwer, viele Fehler → eher leicht
  const fp=stats(d).firstPct,target=fp>=80?3:fp>=55?2:1;
  let best=cands[0],bs=-1;
  for(const c of cands){let sc=Math.random();if(!recent.includes(c.t))sc+=2;if(c.key.startsWith('x'))sc+=.5;sc+=1.5-Math.abs(lvlOf(c)-target)*.9;if(sc>bs){bs=sc;best=c}}
  return best;
}
function controlPlan(U=cur.unit,h=cur.h){const c=U.homeworks[h-1].control||{};return{words:c.words??4,sentences:c.sentences||[],nSent:Math.min(c.nSentences??1,(c.sentences||[]).length)}}
function addControl(d){
  const U=cur.unit,plan=controlPlan(),used=new Set(d.usedKeys),n=plan.words+plan.nSent;
  const capTxt=d.capped?`Du hast schon **${Math.round(CONFIG.capSeconds/60)} Minuten** gearbeitet – das reicht für heute! Die restlichen Übungen zählen als erledigt.\n\n`:'';
  addTask(d,{t:'intro',control:true,title:`Nur noch ${n} kurze Fragen bis 100 %!`,text:capTxt+`Zum Schluss kommt die **Lernkontrolle**: ${n} kurze Aufgaben **ohne Hilfe**, je **ein** Versuch. Das dauert nur 1–2 Minuten.\n\nFehler senken deinen HÜ-Wert **nicht** – sie zeigen dir nur, was du noch üben solltest. Wenn du alle Fragen beantwortet hast, bekommst du deine Ergebniskarte mit **100 %**.`});
  const words=[...new Set([...weakIds(d),...shuffle(hwWords(U,cur.h)),...shuffle(introduced(U,cur.h))])].slice(0,plan.words);
  words.forEach(w=>{const W=U.words[w];
    const c=genCtx(w,'write',used)||genCtx(w,'write',new Set());   // möglichst ein Satz, den das Kind noch nicht hatte
    if(c&&c.ans?.length)addTask(d,{t:c.t==='sent'?'sent':'gap',control:true,q:c.q,first:c.first,...(c.img?{img:c.img}:{}),...(c.imgs?{imgs:c.imgs}:{}),ans:c.ans,w:[w],key:'ctl-w-'+w});
    else addTask(d,{t:'gap',control:true,q:`Wie heißt das auf Englisch? → ${W.de}`,ans:[W.en,...(W.alt||[])],w:[w],key:'ctl-w-'+w})});
  const sents=shuffle(plan.sentences.filter(s=>!used.has('s:'+canon(s.ans[0])))).concat(shuffle(plan.sentences)).filter((s,i,arr)=>arr.indexOf(s)===i).slice(0,plan.nSent);
  sents.forEach((s,i)=>addTask(d,{t:'sent',control:true,q:'Übersetze ins Englische: '+s.de,ans:s.ans,key:'ctl-s-'+i}));
}
function prune(d,pred){d.queue=d.queue.filter((x,i)=>i<d.index||x.st.done||!pred(x))}

const isCore=a=>a.t!=='intro'&&!a.extra&&!a.review&&!a.control;
function advance(){
  if(view==='practice')return pNext();
  const d=cur.d;d.index++;d.stepSec=0;clockState='';
  if(d.phase!=='control'&&!cur.preview&&d.seconds>=CONFIG.capSeconds&&d.queue.slice(d.index).some(isCore)){
    // Zeitdeckel: restliche Übungen gelten als erledigt, weiter zur Lernkontrolle
    d.queue=d.queue.filter((x,i)=>i<d.index||x.st.done||isCore(x));
    d.queue.slice(d.index).forEach(x=>{x.st.done=true;x.st.skipped=true});
    d.index=d.queue.length;d.capped=true;
  }
  if(d.seconds>=CONFIG.maxSeconds)prune(d,x=>(x.review||x.extra)&&!x.control);
  else if(d.seconds>=minSec())prune(d,x=>x.extra&&!x.control);
  if(d.index>=d.queue.length){
    if(d.phase==='control')return finishHW();
    if(d.seconds<minSec()&&!d.capped){
      if(d.phase!=='extra'){d.phase='extra';d.extraStart=d.seconds;const n=controlPlan();addTask(d,{t:'intro',extra:true,title:'Zusatzrunde',text:`Super, du hast alle Übungen geschafft! Bis zu den ${Math.round(CONFIG.minSeconds/60)} Minuten Lernzeit fehlen aber noch etwa ${Math.max(1,Math.ceil((minSec()-d.seconds)/60))} Minuten.\n\nJetzt kommen **Zusatzaufgaben** – zuerst zu Wörtern und Regeln, bei denen du Fehler hattest. Danach folgt die **Lernkontrolle** (${n.words+n.nSent} kurze Fragen) – dann hast du **100 %**.`})}
      else{const t=nextExtra(d);t.extra=true;d.extraN++;addTask(d,t)}
    }else{d.phase='control';addControl(d)}
  }
  save();render();window.scrollTo(0,0);
}

/* ---------- Auswertung ---------- */
/* Fortschritt = geplante Übungen + Lernkontrolle. Wiederholungen und Zusatzaufgaben zählen NICHT mit –
   Fehler machen den Weg zu 100 % also nicht länger. Dieser eine Wert erscheint überall
   (Balken, Pause, Abgabe-Bildschirm, Ergebniskarte). */
function progress(d,U,h){
  let done=0,total=0,lost=0;
  for(const a of d.queue){if(isCore(a)||(a.control&&a.t!=='intro')){total++;if(a.st?.done){if(quickLost(a))lost++;else done++}}}
  if(d.phase!=='control'){const p=U?controlPlan(U,h):controlPlan();total+=p.words+p.nSent}
  total=Math.max(1,total);
  return{done,total,lost,left:total-done-lost,pct:Math.round(100*done/total),max:Math.round(100*(total-lost)/total),goal:lost?Math.round(100*(total-lost)/total)+' %':'100 %'};
}
/* Was ist am Ende noch unsicher? Es zählt jeweils der LETZTE Versuch zu einem Wort bzw. einer Regel. */
function weakOf(d){
  const W={},R={};
  for(const a of d.queue){
    const st=a.st||{};if(a.t==='intro'||!st.done||st.skipped||a.t==='reading')continue;
    const bad=new Set(st.first?[]:(st.errWords&&st.errWords.length?st.errWords:a.w||[]));
    (a.w||[]).forEach(w=>{W[w]=!bad.has(w)});
    if(a.rule)R[a.rule]=!!st.first;
  }
  const U=cur.unit;
  return{words:Object.keys(W).filter(w=>!W[w]&&U.words[w]),rules:Object.keys(R).filter(r=>!R[r])};
}
function stats(d){
  let practice=0,first=0,ctlOk=0,ctlTotal=0;
  for(const a of d.queue){
    const st=a.st||{};
    if(a.t==='intro')continue;
    if(a.control){if(st.done){ctlTotal++;if(st.first)ctlOk++}continue}
    if(a.t==='reading'){(st.ans||[]).forEach(x=>{if(x&&x.done){practice++;if(x.ok)first++}});continue}
    if(!st.done||st.skipped)continue;
    if(a.t==='cloze'&&st.firstRes){practice+=st.firstRes.length;first+=st.firstRes.filter(Boolean).length;continue}
    practice++;if(st.first)first++;
  }
  const P=progress(d),wk=weakOf(d);
  const lvl=!ctlTotal?'-':ctlOk/ctlTotal>=.8?'S':ctlOk/ctlTotal>=.5?'U':'B';
  return{wert:P.pct,done:P.done,total:P.total,lost:P.lost,practice,firstPct:practice?Math.round(100*first/practice):0,ctlOk,ctlTotal,lvl,
    weakIds:wk.words,weak:wk.words.map(w=>cur.unit.words[w].en),rules:wk.rules};
}
function sig(p){return cyrb53([CONFIG.secret,p.unit,p.h,normName(p.n),normName(p.k),p.wert,p.lvl,p.date].join('|')).toString(36).toUpperCase().slice(-5)}
// status: 'done' = vollständig · 'early' = vom Kind vorzeitig beendet · 'deadline' = bei Fristende nicht fertig
function makeResult(status){
  const d=cur.d,s=stats(d),finished=status==='done';
  const p={unit:cur.unit.id,unitLabel:unitLabel(cur.unit),hwTitle:`HÜ ${hwNo(cur.unit,cur.h)}: ${cur.unit.homeworks[cur.h-1].title}`,h:cur.h,n:cur.u.name,k:cur.u.klasse,
    wert:finished?s.wert:Math.min(99,s.wert),sec:d.seconds,lvl:finished?s.lvl:'-',ctl:finished?`${s.ctlOk}/${s.ctlTotal}`:'',first:s.firstPct,weak:s.weak.slice(0,8),
    weakIds:s.weakIds,rules:s.rules,done:s.done,total:s.total,lost:s.lost,capped:!!d.capped,quick:d.quick,junk:d.junk,tasks:s.practice,date:dateStr(),finished,status};
  p.code=sig(p);return p;
}
function endHW(status){
  const d=cur.d;
  d.finished=new Date().toISOString();d.result=makeResult(status);
  save();cardData=d.result;view='card';render();window.scrollTo(0,0);
}
const finishHW=()=>endHW('done');
const STATUS_HEAD={done:'✓ Hausübung erledigt',early:'⏹ Vorzeitig beendet – nicht fertig',deadline:'⏰ Frist abgelaufen – nicht fertig'};
const statusOf=p=>p.status||(p.finished?'done':'early');
function fmtDeadline(ms){return new Date(ms).toLocaleString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
// Angezeigte HÜ-Nummer: Unit-Dateien können mit hwStart weiterzählen (z. B. hwStart: 4 → HÜ 4, 5, 6 …). Links und Speicherstand bleiben bei 1, 2, 3 …
const hwNo=(U,h)=>(U?.hwStart||1)+h-1;
const unitLabel=U=>[U.book,U.title].filter(Boolean).join(' · ');

/* ---------- Uhr ---------- */
function capFor(a){
  if(!a)return CONFIG.stepCap;
  if(a.t==='intro')return 60;
  if(a.t==='reading')return readPhase(a)==='read'?CONFIG.readingCap:CONFIG.stepCap;
  if(a.multi)return CONFIG.writingCap;
  return CONFIG.stepCap;
}
// Vorwarnung: ab 30 Minuten vor der Frist
function dlWarn(dl){
  if(!dl||cur?.preview)return'';const left=dl-Date.now();if(left<=0||left>30*60000)return'';
  const t=new Date(dl).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  return`⚠ Abgabe endet um ${t} (noch ${Math.ceil(left/60000)} Min.) · `;
}
function idleFor(a){
  if(!a)return CONFIG.idleLimit;
  if(a.t==='reading'&&readPhase(a)==='read')return CONFIG.idleReading;
  if(['gap','find','cloze','sent','pic','open','transform','correct','listen'].includes(a.t))return CONFIG.idleWriting;
  return CONFIG.idleLimit;
}
function tick(){
  if(!cur)return;
  if(view==='vocab'){
    const v=cur.v;
    if(!cur.preview&&!v.submitted&&vOver()){vSubmit('vdeadline');return}
    if(document.visibilityState!=='visible'){clockState='hidden';return}
    if((Date.now()-lastActivity)/1000>CONFIG.idleLimit)clockState='idle';
    else if(v.stepSec>=CONFIG.stepCap)clockState=v.cur?.st?.done?'capdone':'cap';
    else{clockState='';v.seconds++;v.sessionSec++;v.stepSec++;if(v.seconds%5===0)save()}
    updateClock();return;
  }
  if(view!=='task')return;
  if(!cur.preview&&cur.d.deadline&&Date.now()>cur.d.deadline){endHW('deadline');return}
  const d=cur.d,a=currentTask();
  if(document.visibilityState!=='visible'){clockState='hidden';return}
  const idle=(Date.now()-lastActivity)/1000;
  if(idle>idleFor(a))clockState='idle';
  else if(d.stepSec>=capFor(a))clockState=a&&a.st.done?'capdone':'cap';
  else{clockState='';d.seconds++;d.stepSec++;if(d.seconds%5===0)save()}
  updateClock();
  const rb=$('#readbtn');if(rb&&rb.disabled&&a?.t==='reading'&&d.stepSec>=minReadFor(a)){rb.disabled=false;const n=$('#readnote');if(n)n.textContent=''}
}
function updateClock(){
  const el=$('#clock');if(!el||!cur)return;
  let txt,cls='clock';
  if(view==='vocab'){
    const v=cur.v;
    if(clockState==='idle'){txt='⏸ Uhr pausiert – tippe oder scrolle, um weiterzumachen.';cls+=' paused'}
    else if(clockState==='cap'){txt='⏸ Uhr angehalten – beantworte zuerst diese Aufgabe.';cls+=' paused'}
    else if(clockState==='capdone'){txt='⏸ Uhr angehalten – tippe auf „Weiter“.';cls+=' paused'}
    else if(v.sessionSec>=CONFIG.minSeconds){txt=`⏱ Übungszeit ${fmt(v.seconds)} · Super, für heute reicht’s! Morgen weiterüben hilft beim Merken.`;cls+=' reached'}
    else txt=`⏱ Übungszeit ${fmt(v.seconds)}`;
    const w=v.submitted?'':dlWarn(v.deadline);if(w){txt=w+txt;cls='clock paused'}
    el.textContent=txt;el.className=cls;return;
  }
  const d=cur.d,P=progress(d),aufg=n=>`noch ${n} ${n===1?'Aufgabe':'Aufgaben'}`;
  const tLeft=Math.max(0,minSec()-d.seconds),mLeft=Math.ceil(tLeft/60),minTxt=m=>m<=1?'1 Minute':m+' Minuten';
  if(d.phase==='extra'){
    // Zusatzrunde: Balken = verbleibende Zeit, damit Fortschritt sichtbar bleibt
    const start=d.extraStart??Math.max(0,minSec()-300),span=Math.max(1,minSec()-start),pct=Math.min(100,Math.round(100*(d.seconds-start)/span));
    const bar=$('#pbar'),lab=$('#plabel');if(bar)bar.style.width=pct+'%';
    if(lab)lab.innerHTML=tLeft>0?`Zusatzrunde · noch <b>${minTxt(mLeft)}</b>`:'Zusatzrunde · <b>Zeit erreicht</b>';
  }
  const a=currentTask();
  if(clockState==='idle'){txt='⏸ Uhr pausiert – tippe oder scrolle, um weiterzumachen.';cls+=' paused'}
  else if(clockState==='cap'){txt='⏸ Uhr angehalten – beantworte zuerst diese Aufgabe.';cls+=' paused'}
  else if(clockState==='capdone'){txt='⏸ Uhr angehalten – tippe auf „Weiter“.';cls+=' paused'}
  else if(d.phase==='control'){txt=`✓ Lernkontrolle – ${aufg(P.left)} bis ${P.goal}!`;cls+=' reached'}
  else if(d.phase==='extra'){
    if(tLeft<=0){txt=`✓ Geschafft! Nach dieser Aufgabe kommen ${P.left} kurze Fragen – dann hast du ${P.goal}.`;cls+=' reached'}
    else if(a&&a.extra&&a.t!=='intro'&&a.st.done&&a.st.first){txt=`✓ Gut gemacht! Noch ${minTxt(mLeft)} Zusatzrunde, dann ${P.left} kurze Fragen bis ${P.goal}.`;cls+=' reached'}
    else txt=`⏱ Zusatzrunde: noch ${minTxt(mLeft)}, dann ${P.left} kurze Fragen bis ${P.goal}.`;
  }
  // Vor 15 Minuten ehrlich: 100 % gibt es erst, wenn auch die Mindestzeit erreicht ist
  else if(tLeft>0)txt=`⏱ Lernzeit ${fmt(d.seconds)} · ${aufg(P.left)} · ${P.goal} frühestens in ${minTxt(mLeft)}`;
  else txt=`⏱ Lernzeit ${fmt(d.seconds)} · ${aufg(P.left)} bis ${P.goal}`;
  const w=dlWarn(d.deadline);if(w&&clockState===''){txt=w+txt;cls='clock paused'}
  el.textContent=txt;el.className=cls;
}
['pointerdown','keydown','input','touchstart','wheel'].forEach(ev=>window.addEventListener(ev,()=>{lastActivity=Date.now()},{passive:true,capture:true}));
window.addEventListener('scroll',()=>{lastActivity=Date.now()},{passive:true,capture:true});

function setHeader(pill,title){$('#pill').textContent=pill;$('#htitle').textContent=title}
function render(){
  try{glHide()}catch(e){}
  $('#hdr').style.display=view==='card'?'none':'';   // auf der Ergebniskarte kein Kopf → Karte passt auf einen Screenshot
  if(view==='teacher')return renderTeacher();
  if(view==='vlist')return renderVList(cardData);
  if(view==='card')return renderCard(cardData);
  if(view==='vpause'&&cur)return renderVPause();
  if(view==='vocab'&&cur)return renderVocab();
  if(view==='paused'&&cur)return renderPaused();
  if(view==='endask'&&cur)return renderEndAsk();
  if(view==='practice'&&cur)return renderPractice();
  if(view==='home'||!cur)return renderHome();
  const a=currentTask();
  if(!a){advance();return}
  shell(taskHTML(a));
}
/* Schreib-Plan für freies Schreiben: Hilfe VOR dem Schreiben statt erst nach Fehlern.
   1 Beispiel mit anderem Thema ansehen · 2 eigene Wörter für Satz 1 antippen · 3 selbst schreiben (Wörter als Notiz daneben).
   plan: {example, about, s1, slots: [{name, from: […], not: 0}], frame: '{A0} is ____ than {a2}.', bank: {label, words: […]}}
   In frame: {0} = gewähltes Wort · {a0} = mit a/an · {A0} = mit A/An. Starke Schreiber können den Plan überspringen. */
const withArt=(w,cap)=>(/^[aeiou]/i.test(w)?(cap?'An ':'an '):(cap?'A ':'a '))+w;
const planPicks=a=>a.plan&&a.st.picks&&a.plan.slots.every((_,k)=>a.st.picks[k]!=null)?a.plan.slots.map((sl,k)=>sl.from[a.st.picks[k]]):null;
function ownFrame(a){
  const P=planPicks(a);if(!P||!a.plan.frame)return null;
  return a.plan.frame.replace(/\{(a|A)?(\d)\}/g,(m,art,k)=>art?withArt(P[+k],art==='A'):P[+k])+(a.plan.frame2&&!a.st.easy?' '+a.plan.frame2:'');
}
/* Schreibtreppe: Vor der freien Aufgabe stehen Stufen mit genau einer Lösung (stair: true) – Abschauen, Stichwörter mit Gerüst,
   Stichwörter ohne Gerüst. Wer dort Hilfe gebraucht hat, bekommt die freie Aufgabe in der leichteren Form (easy):
   EIN eigener Satz, das Gerüst mit den eigenen Wörtern steht sofort da. */
function easyCheck(a){
  const st=a.st;if(st.easy!=null||!a.easy||a.control||view==='practice')return;
  const stairs=(cur.d?.queue||[]).filter(x=>x.stair&&x.st?.done&&!x.st.skipped);
  st.easy=stairs.some(x=>!x.st.first);
  if(st.easy){a.qFull=a.q;a.q=a.easy.q;a.rules=a.easy.rules;a.model=a.easy.model;a.multi=false;if(a.easy.frame)a.plan={...a.plan,frame:a.easy.frame};save()}
}
function rPlan(a){
  const st=a.st,pl=a.plan;st.picks??={};
  if(!st.pp)return`<h2>${esc(a.head||'Schreibe selbst')}</h2><p class="q">${esc(a.q)}</p>${st.easy?'<p class="note">Heute reicht <b>ein</b> eigener Satz – den schaffst du!</p>':''}
    <div class="fb"><b>💡 So kann das aussehen</b> – ein Beispiel mit einem anderen Thema:</div><div class="frame" style="font-weight:400">${esc(pl.example)}</div>
    <p class="note">${esc(pl.about||'Du schreibst gleich deine eigenen Sätze.')}</p>
    <p><button data-act="pl-go" id="stepbtn">Wörter für meinen Satz aussuchen →</button> ${st.easy?'':'<button class="secondary" data-act="pl-skip">Ich schreibe gleich selbst</button>'}</p>`;
  const all=pl.slots.every((_,k)=>st.picks[k]!=null);
  const rows=pl.slots.map((sl,k)=>`<p style="margin:12px 0 4px"><b>${esc(sl.name)}</b></p><div class="sortbtns">${sl.from.map((w,j)=>{
    const taken=sl.not!=null&&st.picks[sl.not]!=null&&pl.slots[sl.not].from[st.picks[sl.not]]===w;
    return`<button class="chip ${st.picks[k]===j?'sel':''}" data-act="pl-pick" data-i="${k}" data-j="${j}" ${taken?'disabled':''}>${esc(w)}</button>`}).join('')}</div>`).join('');
  return`<h2>Dein Schreib-Plan</h2><p class="q">${esc(pl.s1||'Worüber schreibst du in Satz 1? Tippe an.')}</p>${rows}
    <p style="margin-top:16px"><button data-act="pl-done" id="stepbtn" ${all?'':'disabled'}>Jetzt schreiben →</button></p>`;
}
function planNotes(a){
  if(!a.plan||a.st.done)return'';
  const P=planPicks(a),b=a.st.easy?null:a.plan.bank;
  return`<div class="plan">${P?`<b>Deine Wörter für Satz 1:</b> ${P.map(esc).join(' · ')}<br>`:''}${b?`<b>${esc(b.label||'Ideen für Satz 2')}:</b> ${b.words.map(esc).join(' · ')}`:''}
    ${P?'':`<br><button class="secondary small" data-act="pl-back">Wörter aussuchen (Hilfe)</button>`}</div>`;
}
/* Erklärung in kleinen Schritten: je Schritt ein kurzer Gedanke + eine Verständnisfrage.
   steps: [{text, img/imgs, check: {q, right, wrong:[…], why}, check2: {…}}], summary: 'Merke …'
   Falsche Antwort → Erklärung, danach (falls vorhanden) eine zweite, ähnliche Frage. Zählt nicht zur Wertung. */
function rSteps(a){
  const st=a.st;st.si??=0;st.ck??=0;
  const n=a.steps.length;
  if(st.si>=n)return`<h2>${esc(a.title)}</h2><div class="fb good"><b>✓ Geschafft!</b> ${a.summary?'Das hast du gerade gelernt:':''}</div>${a.summary?`<div class="merke">${md(a.summary)}</div>`:''}<p><button data-act="next" id="nextbtn">Los geht’s →</button></p>`;
  const S=a.steps[st.si],C=st.ck===1?S.check2:S.check;
  const dots=a.steps.map((_,i)=>`<span class="sdot ${i<st.si?'done':i===st.si?'now':''}"></span>`).join('');
  let h=`<h2>${esc(a.title)}</h2><p class="note">Schritt ${st.si+1} von ${n} ${dots}</p>${imgStrip(S)}<div class="step">${md(S.text)}</div>`;
  if(!C)return h+`<p><button data-act="is-next" id="stepbtn">${st.si===n-1?'Fertig →':'Weiter →'}</button></p>`;
  const k=st.si+'-'+st.ck;
  if(!st.io||st.io.k!==k){const o=[C.right,...C.wrong];st.io={k,o:shuffle(o.map((_,i)=>i))};st.stepAt=Date.now();st.fastOnce=false;st.imsg=''}
  const opts=st.io.o.map(i=>{const t=i===0?C.right:C.wrong[i-1];let c='choice';if(st.idone){if(i===0)c+=' right';else if(i===st.isel)c+=' wrong'}else if(st.isel===i)c+=' sel';
    return`<button class="${c}" data-act="is-sel" data-i="${i}" ${st.idone?'disabled':''}>${esc(t)}</button>`}).join('');
  h+=`<div class="fb"><b>🤔 ${st.ck===1?'Noch eine Frage dazu:':'Hast du es verstanden?'}</b> ${esc(C.q)}</div><div class="choices">${opts}</div>`;
  if(!st.idone)return h+(st.imsg?fbox(st.imsg,false):'')+`<button data-act="is-check" ${st.isel==null?'disabled':''}>Antwort bestätigen</button>`;
  const ok=st.isel===0;
  h+=fbox((ok?'✓ Richtig! ':'Nicht ganz. ')+(C.why||''),ok);
  if(!ok&&st.ck===0&&S.check2)return h+`<p><button data-act="is-again" id="stepbtn">Noch eine Frage dazu →</button></p>`;
  return h+`<p><button data-act="is-next" id="stepbtn">${st.si===n-1?'Fertig →':'Nächster Schritt →'}</button></p>`;
}
// Bilder zu einer Aufgabe oder einem Lesetext: img (eines) oder imgs (mehrere, z. B. zwei Tiere zum Vergleichen)
function imgStrip(x){
  const L=x.imgs||(x.img?[x.img]:[]);if(!L.length)return'';
  const need=x.t&&needsImg(x)?'imgMissing(this)':'this.remove()';
  return`<div class="timgs ${L.length===1?'one':L.length>2?'three':''}">${L.map(p=>`<img src="${esc(imgSrc(p))}" alt="" onerror="${need}">`).join('')}</div>`;
}
/* Aufgaben, die ohne Bild nicht lösbar sind („Welches Tier ist das?“). Fehlt das Bild (noch nicht hochgeladen, schlechtes Netz),
   wird die Aufgabe übersprungen statt unlösbar dazustehen – sie zählt nicht gegen das Kind. */
const needsImg=a=>!!(a.img||a.imgs)&&(a.pic===true||/(welches tier ist das|dieses tier|was ist das|auf dem bild|siehst du)/i.test(a.q||''));
function imgMissing(el){
  el.remove();const a=currentTask();if(!a||a.st.done||!needsImg(a))return;
  a.st.done=true;a.st.skipped=true;a.st.noImg=true;save();render();
}
function taskHTML(a){
  const sk=a.key+'-'+(a.t==='reading'?(a.st.qi||0):0);
  if(!shownAt[sk])shownAt[sk]=Date.now();
  let html='';
  switch(a.t){
    case'intro':html=a.steps?rSteps(a):`<h2>${esc(a.title)}</h2>${md(a.text)}<p><button data-act="next" id="nextbtn">Los geht’s →</button></p>`;break;
    case'mc':html=rMC(a);break;
    case'reading':html=rReading(a);break;
    case'gap':html=rTyped(a,a.control?'Lernkontrolle':'Schreibe das fehlende Wort',`<p class="q">${gapQ(a)}</p>${a.first&&!a.control?'<p class="note">Lies den ganzen Satz – er verrät dir das Wort. Der erste Buchstabe ist vorgegeben.</p>':''}${a.hintImg&&!a.img&&!a.imgs&&(a.st.level||0)>=1?imgStrip({img:a.hintImg}):''}`);break;
    case'sent':html=rTyped(a,a.control?'Lernkontrolle':(a.head||'Schreibe auf Englisch'),`<p class="q">${esc(a.q)}</p>${a.from?`<div class="srcsent">${esc(a.from)}</div>`:''}${a.keys?`<div class="keys">${a.keys.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}${a.show&&!a.st.done?`<div class="frame">${esc(a.show)}</div>`:''}`);break;
    case'pic':html=rTyped(a,'Bildaufgabe',scene(a.scene)+`<p class="q">${esc(a.q)}</p>`);break;
    case'open':easyCheck(a);html=a.plan&&!a.st.done&&(a.st.pp||0)<2?rPlan(a):rTyped(a,a.head||'Schreibe selbst',`<p class="q">${esc(a.q)}</p>${planNotes(a)}`);break;
    case'order':html=rOrder(a);break;
    case'match':html=rMatch(a);break;
    case'find':html=rFind(a);break;
    case'odd':html=rMC(a,'Was passt nicht?');break;
    case'letters':html=rLetters(a);break;
    case'sort':html=rSort(a);break;
    case'cloze':html=rCloze(a);break;
    case'dialog':html=rOrder(a);break;
    case'listen':html=rTyped(a,'Hören und schreiben',`<p class="q">${esc(a.q||(isLadder(a)?'Hör gut zu und schreib den Satz auf.':'Hör gut zu und schreib das Wort auf.'))}</p><p><button class="secondary" data-act="say">🔊 Anhören</button> <button class="secondary" data-act="sayslow">🐢 Langsam</button></p>${a.de&&a.st.level>=1?`<p class="note">Auf Deutsch: ${esc(a.de)}</p>`:''}`);break;
    case'transform':html=rTyped(a,'Forme den Satz um',`<p class="q">${esc(a.q)}</p><div class="srcsent">${esc(a.from)}</div>`);break;
    case'correct':{const n=a.n||1;html=rTyped(a,'Verbessere den Satz',`<p class="q">${esc(a.q||`In diesem Satz ${n===1?'ist ein Fehler':'sind '+n+' Fehler'}. Schreib den ganzen Satz richtig.`)}</p><div class="srcsent">${a.st.level>=2&&a.mark?markWords(a.sentence,a.mark):esc(a.sentence)}</div>`);break}
  }
  // Bildfrage ohne Bild (z. B. in einer früher erstellten Lernkontrolle): Bild zum Wort ergänzen – gibt es keines, nach dem deutschen Wort fragen
  if(!a.img&&!a.imgs&&a.t==='gap'&&/(welches tier ist das|dieses tier|was ist das)/i.test(a.q||'')&&a.w?.[0]&&cur.unit.words[a.w[0]]){
    const p=imgOfWord(a.w[0]);if(p)a.img=p;else a.q=`Wie heißt das auf Englisch? → ${cur.unit.words[a.w[0]].de}`}
  if(a.st?.noImg)return`<h2>Bild fehlt</h2>${fbox('Das Bild zu dieser Aufgabe konnte nicht geladen werden. Die Aufgabe wird übersprungen und zählt nicht gegen dich.',null)}<p><button data-act="next" id="nextbtn">Weiter →</button></p>`;
  if(a.t!=='reading'&&(a.img||a.imgs))html=html.replace('</h2>','</h2>'+imgStrip(a));
  if(a.st?.quickWrong)html=html.replace('</h2>','</h2><div class="fb bad"><b>⚡ Zu schnell geklickt – diese Aufgabe zählt nicht.</b> Lies zuerst genau und denk nach, bevor du antwortest!</div>');
  return html;
}
function shell(inner){
  const d=cur.d,U=cur.unit;
  setHeader(unitLabel(U),cur.preview?'Vorschau – ohne Mindestzeit und Zusatzrunde, nichts wird gespeichert':CONFIG.title);
  const P=progress(d),a=currentTask();
  const what=a?.review?'Wiederholung':a?.extra&&a.t!=='intro'?'Zusatzaufgabe':d.phase==='control'?'Lernkontrolle':`Aufgabe ${Math.min(P.done+(a&&isCore(a)&&a.st.done?0:1),P.total)} von ${P.total}`;
  const endBtn=cur.preview?'<button class="secondary small" data-act="next">Überspringen ⏭</button>':'<button class="secondary small" data-act="endearly" style="margin-left:auto">Vorzeitig abgeben</button>';
  app.innerHTML=`<section class="card compact"><div class="row"><strong>HÜ ${hwNo(cur.unit,cur.h)} – ${esc(U.homeworks[cur.h-1].title)}</strong><span class="note" id="plabel">${what} · Stand <b>${P.pct} %</b></span></div><div class="progress"><div id="pbar" style="width:${P.pct}%"></div></div><div id="clock" class="clock"></div></section>
  <section class="card" id="task">${inner}</section>
  <div class="nav"><button class="secondary small" data-act="${cur.preview?'teacher':'pause'}">${cur.preview?'← Zur Lehrerseite':'⏸ Pause'}</button>${endBtn}</div>`;
  updateClock();
}
const nextBtn=(l='Weiter →')=>`<p><button data-act="next" id="nextbtn">${l}</button></p>`;
const fbox=(msg,good)=>msg?`<div class="fb ${good===null?'':good?'good':'bad'}" id="msg">${esc(msg)}</div>`:'';   // null = neutral (blau)

function rMC(a,head){
  const st=a.st;
  const opts=a.opts.map((o,i)=>{let c='choice';if(st.done){if(i===a.ans)c+=' right';else if(i===st.sel)c+=' wrong'}else if(st.sel===i)c+=' sel';return`<button class="${c}" data-act="mc-sel" data-i="${i}" ${st.done?'disabled':''}>${String.fromCharCode(65+i)}) ${esc(o)}</button>`}).join('');
  return`<h2>${head||'Wähle die passende Antwort'}</h2><p class="q">${esc(a.q||(a.t==='odd'?'Welches Wort passt nicht zu den anderen?':''))}</p><div class="choices">${opts}</div>`+
    (st.done?fbox((st.first?'✓ Richtig! ':'Nicht ganz – richtig ist: „'+a.opts[a.ans]+'“. ')+(a.why||''),st.first)+nextBtn()
            :`<button data-act="mc-check" ${st.sel==null?'disabled':''}>Antwort bestätigen</button>`);
}
/* Lesetext in drei Schritten: 1. nur lesen (Fragen versteckt, „Gelesen“ erst nach Mindestzeit)
   2. Fragen aus dem Gedächtnis (gist, Text versteckt) · 3. Detailfragen mit Text – bei Fehlern wird die Stelle markiert */
const readPhase=a=>a.st.phase||((a.st.ans||[]).some(x=>x&&x.done)?'q':'read');
const minReadFor=a=>cur.preview?3:(a.minRead||0);
/* Wort-Hilfe im Text: glosses = {'took part': 'nahmen teil', …} – Übersetzung im Zusammenhang, nicht Wort für Wort.
   Antippen (Handy/Tablet) oder Maus darüber (Computer) zeigt die Übersetzung. Unit-Wörter bewusst NICHT übersetzen (die sind das Lernziel).
   Ältere Units mit gloss: 'tall = groß · …' funktionieren weiter: Was im Text vorkommt, wird antippbar, der Rest steht darunter. */
function glossMap(R){
  const M={...(R.glosses||{})},rest=[];
  String(R.gloss||'').split('·').map(x=>x.trim()).filter(Boolean).forEach(it=>{const k=it.indexOf(' = ');if(k<0){rest.push(it);return}

/* ---------- Nachüben (nach der Abgabe – nur für das Kind, die Karte ändert sich nicht) ----------
   Geübt wird, was am Ende noch unsicher war: Wörter („Noch üben“) und Regeln („Regel üben“).
   Ein Punkt ist beherrscht, wenn er zweimal ohne Hilfe richtig war (mit anderen Aufgaben dazwischen). */
const PTYPES=['mc','gap','find','order','sent','odd','letters','sort','cloze','dialog','listen','transform','correct'];
function rulePool(r){
  const U=cur.unit,h=cur.h,out=[];
  (U.extras||[]).forEach((x,i)=>{if(x.rule===r&&(x.minHw||1)<=h&&PTYPES.includes(x.t)&&usable(x))out.push({x,k:'x'+i})});
  U.homeworks.slice(0,h).forEach((hw,hi)=>hw.tasks.forEach((x,ti)=>{if(x.rule===r&&PTYPES.includes(x.t)&&usable(x))out.push({x,k:`c${hi+1}-${ti}`})}));
  return out;
}
function pItems(){
  const p=cur.d.result,U=cur.unit;
  const ids=p.weakIds||(p.weak||[]).map(en=>Object.keys(U.words).find(k=>U.words[k].en===en)).filter(Boolean);
  const words=ids.filter(w=>U.words[w]&&!U.words[w].skipGen).map(w=>({key:'w:'+w,id:w,label:U.words[w].en,sub:U.words[w].de}));
  const rules=(p.rules||[]).filter(r=>rulePool(r).length).map(r=>({key:'r:'+r,id:r,label:r,sub:'Regel'}));
  return[...words,...rules];
}
function pState(){const P=cur.d.practice??={items:{},n:0,cur:null,used:{},last:null};pItems().forEach(it=>P.items[it.key]??={lvl:0,wins:0,lastWin:null,due:0});return P}
const pLevel=S=>!S?0:S.done?2:(S.lvl>0||S.wins>0)?1:0;
const P_ICON=['🟠 noch unsicher','🟡 fast','✅ beherrscht'];
function pCount(){const P=pState(),L=pItems();return{n:L.length,ok:L.filter(it=>P.items[it.key].done).length}}
function pPick(){
  const P=pState(),open=pItems().filter(it=>!P.items[it.key].done);
  if(!open.length)return null;
  let pool=open.filter(it=>it.key!==P.last);if(!pool.length)pool=open;
  pool.sort((a,b)=>P.items[a.key].due-P.items[b.key].due||pLevel(P.items[a.key])-pLevel(P.items[b.key]));
  const cand=pool.slice(0,2);return cand[Math.floor(Math.random()*cand.length)];
}
function pMake(it){
  const P=pState(),S=P.items[it.key];let a;
  if(it.key.startsWith('w:')){const used=new Set(Object.keys(P.used));const kind=S.lvl===0?'choice':'write';
    a=genCtx(it.id,kind,used)||genCtx(it.id,kind,new Set())||(S.lvl===0?genMC(it.id):genGap(it.id));P.used[a.key]=(P.used[a.key]||0)+1;}
  else{
    const all=rulePool(it.id),mcs=all.filter(o=>isChoiceTask(o.x)),typed=all.filter(o=>!isChoiceTask(o.x));
    // Einstieg mit Auswahl, „beherrscht“ nur über selbst geschriebene/gebaute Sätze
    const pool=S.lvl===0&&mcs.length?mcs:typed.length?typed:all,min=Math.min(...pool.map(o=>P.used[o.k]||0));
    const least=pool.filter(o=>(P.used[o.k]||0)===min),o=least[Math.floor(Math.random()*least.length)];
    P.used[o.k]=(P.used[o.k]||0)+1;a=clone(o.x);
  }
  delete a.st;delete a.stair;delete a.head;prep(a,cur.unit);a.pkey=it.key;a.key='p'+P.n+'-'+it.key;
  return a;
}
function pNext(){
  const P=pState();if(P.cur)P.last=P.cur.pkey;
  const it=pPick();P.cur=it?pMake(it):null;cur.pList=!it;
  save();render();window.scrollTo(0,0);
}
function pAfter(a,first){
  const P=pState(),S=P.items[a.pkey],st=a.st;st.done=true;st.first=first;P.n++;
  const othersOpen=pItems().some(it=>it.key!==a.pkey&&!P.items[it.key].done);
  if(isChoiceTask(a)){S.lvl=first?1:0;S.due=P.n+1}
  else if(first){if(S.lastWin==null||P.n-S.lastWin>=2||!othersOpen)S.wins++;S.lastWin=P.n;S.lvl=1;S.due=P.n+2}
  else{S.wins=0;S.lvl=1;S.due=P.n+1}
  const it=pItems().find(x=>x.key===a.pkey);
  if(S.wins>=2&&!S.done){S.done=true;st.pmsg=`⭐ „${it.label}“ ist jetzt beherrscht!`}
  else st.pmsg=S.done?'':first&&!isChoiceTask(a)?`„${it.label}“: noch einmal ohne Hilfe richtig, dann ist es beherrscht.`:'';
  save();
}

/* Verteiltes Lernen (vocab.spaced: true): Ein Wort zählt mehr, wenn es an VERSCHIEDENEN Tagen ohne Hilfe gewusst wurde.

   Wie lange oder wie oft ein Kind übt, ist egal – es zählt nur, dass die Tage verschieden sind (Kalendertag auf diesem Gerät).
   Pro Wort gespeichert: d1 = Tag, an dem es zum ersten Mal sicher war · cday = Tag der letzten Wertung · conf = Zahl der Bestätigungen (0–2). */

function vStats(v,U){
  const L=vItems(U),c=[0,0,0,0,0];let sum=0;const weak=[];

function vPick(){

  const introduce=()=>{const it=fresh[0];S[it.id]={lvl:0,wins:0,due:v.n+1,lastWin:null};return{type:'learn',id:it.id}};
  if(vSpaced()){

  const minL=S[pool[0].id].lvl,cand=pool.filter(it=>S[it.id].lvl===minL).slice(0,3);

function vMake(t){
  const U=cur.unit,all=vItems(U),it=all.find(x=>x.id===t.id);t.st={};if(t.type==='dayend')return t;
  if(t.type==='rec'){
    const ok=x=>x.id!==it.id&&x.de!==it.de&&!(it.avoid||[]).includes(x.en)&&!(x.avoid||[]).includes(it.en);
    let pool=all.filter(x=>ok(x)&&x.verb===it.verb);if(pool.length<3)pool=all.filter(ok);
    t.opts=shuffle([it.de,...shuffle(pool).slice(0,3).map(x=>x.de)]);t.ans=t.opts.indexOf(it.de);
  }
  if(t.type==='write'&&it.img&&it.pic)t.mode=Math.random()<.5?'pic':'de';

    let wrong=(it.wrong||[]).slice(0,3);
    if(wrong.length<3)wrong=wrong.concat(shuffle(all.filter(x=>x.id!==it.id&&x.verb===it.verb).map(x=>x.target)).filter(x=>x!==it.target&&!wrong.includes(x))).slice(0,3);

function vAfter(id,type,ok,help){
  const v=cur.v,S=v.items[id];v.n++;v.stepSec=0;

function vFormCheck(it,c,U){

function validateVocab(U){

    if(!x.de)P.push(`${w}: de fehlt`);
    if(x.forms&&(!Array.isArray(x.forms)||x.forms.length!==3))P.push(`${w}: forms braucht genau 3 Formen`);
    if(!x.forms&&!x.en)P.push(`${w}: en fehlt`);
    if(!x.ex||!x.ex.includes('___'))P.push(`${w}: Beispielsatz (ex) mit ___ fehlt`);
    if(x.wrong&&x.wrong.includes(x.target||(x.forms?x.forms[1]:x.en)))P.push(`${w}: richtige Antwort steht auch bei wrong`);
    const id=(x.forms?'v-'+x.forms[0]:'w-'+x.en||'').toLowerCase();if(seen.has(id))P.push(`${w}: doppelt`);seen.add(id);
    if(x.en&&/[()\/]/.test(x.en))P.push(`${w}: keine Klammern oder / im englischen Wort`);
  });
  return P;
}

/* Qualitäts-Check einer HÜ: Aufgaben, Typen, Schwierigkeit, grobe Dauer (kalibriert an Unit 3: HÜ 1 ≈ 16–17 Min. bei wenigen Fehlern) */
const SEC_EST={mc:25,odd:20,letters:30,match:60,sort:60,gap:30,order:30,dialog:50,find:40,listen:40,sent:55,pic:65,cloze:55,transform:65,correct:65,open:110,reading:170};
const TYPE_NAME={mc:'Auswahl',odd:'Was passt nicht',letters:'Buchstabensalat',match:'Zuordnen',sort:'Sortieren',gap:'Lücke',order:'Satz bauen',dialog:'Dialog ordnen',find:'Fehler finden',listen:'Hören',sent:'Satz schreiben',pic:'Bild',cloze:'Lückentext',transform:'Umformen',correct:'Verbessern',open:'Freies Schreiben',reading:'Lesen'};
function hwProfile(U,hi){
  const hw=U.homeworks[hi],T=hw.tasks.filter(x=>x.t!=='intro');
  const types={};T.forEach(x=>types[x.t]=(types[x.t]||0)+1);
  const lv=[0,0,0,0];T.forEach(x=>lv[lvlOf(x)]++);
  const steps=hw.tasks.reduce((n,x)=>n+(x.steps?.length||0),0);
  const c=hw.control||{};let sec=steps*25+T.filter(x=>x.plan).length*40+T.reduce((a,x)=>a+(x.stair?40:SEC_EST[x.t]||40)+(x.t==='cloze'&&/\[\[/.test(x.text||'')?25:0),0)+((c.words??4)+Math.min(c.nSentences??1,(c.sentences||[]).length))*20+30;
  let run=1,maxRun=1;for(let i=1;i<T.length;i++){run=T[i].t===T[i-1].t?run+1:1;maxRun=Math.max(maxRun,run)}
  const warn=[];const min=Math.round(sec/60);
  if(T.length>18)warn.push(`${T.length} Aufgaben – empfohlen sind 16–18`);
  if(min>18)warn.push(`geschätzt ${min} Min. – eher zu lang`);
  if(Object.keys(types).length<6)warn.push(`nur ${Object.keys(types).length} verschiedene Aufgabentypen – empfohlen mind. 6`);
  if(maxRun>3)warn.push(`${maxRun} Aufgaben gleichen Typs hintereinander`);
  return{n:T.length,types,lv,min,warn};
}

function errorHint(c,U){for(const e of U?.errors||[]){if(RX(e.re).test(c))return e.hint}return null}
// Freies Schreiben: „A a is bigger than a a.“ oder Buchstabensalat erfüllt keine Aufgabe
function gibberish(C){
  const t=C.split(' ').map(x=>x.replace(/[.,!?;:]/g,'')).filter(Boolean);
  if(t.some((x,i)=>i>0&&x===t[i-1]&&x!=='very'&&x!=='ha'))return true;                      // dasselbe Wort zweimal hintereinander
  if(t.some(x=>/^[a-z]$/.test(x)&&x!=='a'&&x!=='i'))return true;                             // einzelne Buchstaben
  if(t.some(x=>/^[a-z]{3,}$/.test(x)&&!/[aeiouy]/.test(x)))return true;                      // „Wörter“ ohne Selbstlaut
  if(t.some(x=>/(.)\1\1/.test(x)||/(asdf|qwer|yxcv|hjkl)/.test(x)))return true;            // aaa, asdf
  const cnt={};t.forEach(x=>{if(x.length>=4)cnt[x]=(cnt[x]||0)+1});
  return Object.entries(cnt).some(([w,n])=>n>=4&&w!=='than');                                  // dasselbe Wort viermal
}
function rulesHint(rules,raw,U){
  const S=splitSentences(raw),cs=S.map(s=>canon(s,U)),C=canon(raw,U);
  if(gibberish(C))return'Schreibe echte englische Sätze mit richtigen Wörtern.';
  for(const r of rules){
    let pass=true,found='',per=null;
    switch(r.type){
      case'match':pass=RX(r.re).test(C);break;
      case'notMatch':pass=!RX(r.re).test(C);break;
      case'count':found=r.res.filter(x=>RX(x).test(C)).length;pass=found>=r.n;break;
      case'sentences':pass=S.length>=r.min;break;
      case'words':pass=C.split(' ').filter(Boolean).length>=r.min;break;
      case'wordsPerSentence':per=cs.map(s=>s.split(' ').length>=r.min);pass=cs.length>0&&per.every(Boolean);break;
      case'eachSentence':per=cs.map(s=>RX(r.re).test(s));pass=cs.length>0&&per.every(Boolean);break;
      case'someSentence':pass=cs.some(s=>RX(r.re).test(s));break;
      case'differentStarts':{const st=cs.map(s=>s.split(' ').slice(0,r.words||2).join(' '));pass=new Set(st).size===st.length;break}
    }
    if(!pass){let h=(r.hint||'Lies die Aufgabe noch einmal genau.').replace('{found}',found);
      // Aufzählung (z. B. „giraffe, elefant, rhino“): sagen, WELCHES Wort nicht gezählt wurde
      if(r.type==='count'&&/,/.test(raw)){const miss=raw.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).filter(x=>!r.res.some(re=>RX(re).test(canon(x,U))));
        if(miss.length)h+=` Nicht gezählt: ${miss.map(x=>'„'+x+'“').join(', ')} – prüfe die Schreibweise.`}
      // Satz für Satz: zeigen, was schon gelungen ist
      if(per&&per.length>1&&per.some(Boolean)){const ok=per.map((x,i)=>x?i+1:0).filter(Boolean),bad=per.map((x,i)=>x?0:i+1).filter(Boolean);
